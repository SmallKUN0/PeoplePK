<!DOCTYPE html>
<html lang="zh-CN">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>作品阅览器</title>
   <style>
       * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-user-select: none; }
       body {
           font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
           background: linear-gradient(135deg, #0a0a1a 0%, #12122e 50%, #0d1b2a 100%);
           min-height: 100vh;
           color: #e0e0ff;
           overflow: hidden;
       }

       /* 列表视图 */
       #listView {
           padding: 40px 20px;
           max-width: 1200px;
           margin: 0 auto;
           min-height: 100vh;
       }
       .header {
           text-align: center;
           margin-bottom: 40px;
           animation: fadeInDown 0.6s ease;
       }
       .header h1 {
           font-size: 2.5rem;
           background: linear-gradient(90deg, #a78bfa, #60a5fa, #34d399);
           -webkit-background-clip: text;
           -webkit-text-fill-color: transparent;
           margin-bottom: 10px;
           letter-spacing: 2px;
       }
       .header p { color: #8892b0; font-size: 0.95rem; }
       
       .loading {
           text-align: center;
           padding: 60px;
           color: #8892b0;
           font-size: 1.1rem;
       }
       .loading::after {
           content: '';
           display: inline-block;
           width: 20px;
           height: 20px;
           border: 2px solid #60a5fa;
           border-top-color: transparent;
           border-radius: 50%;
           margin-left: 10px;
           animation: spin 1s linear infinite;
           vertical-align: middle;
       }

       .file-grid {
           display: grid;
           grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
           gap: 20px;
           animation: fadeInUp 0.6s ease;
       }
       .file-item {
           background: rgba(255,255,255,0.03);
           border: 1px solid rgba(255,255,255,0.08);
           border-radius: 16px;
           padding: 30px 20px;
           text-align: center;
           cursor: pointer;
           transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
           position: relative;
           overflow: hidden;
       }
       .file-item::before {
           content: '';
           position: absolute;
           top: 0; left: 0; right: 0; bottom: 0;
           background: linear-gradient(135deg, rgba(96,165,250,0.1), rgba(52,211,153,0.05));
           opacity: 0;
           transition: opacity 0.3s;
       }
       .file-item:hover {
           transform: translateY(-5px) scale(1.02);
           border-color: rgba(96,165,250,0.3);
           box-shadow: 0 10px 40px rgba(96,165,250,0.15);
       }
       .file-item:hover::before { opacity: 1; }
       .rank-num {
           font-size: 3rem;
           font-weight: 800;
           background: linear-gradient(180deg, #fff, #8892b0);
           -webkit-background-clip: text;
           -webkit-text-fill-color: transparent;
           line-height: 1;
           margin-bottom: 8px;
           position: relative;
       }
       .rank-label {
           font-size: 0.9rem;
           color: #8892b0;
           position: relative;
       }
       .empty {
           text-align: center;
           padding: 80px 20px;
           color: #8892b0;
           grid-column: 1 / -1;
       }
       .empty-icon {
           font-size: 4rem;
           margin-bottom: 20px;
           opacity: 0.3;
       }

       /* 阅览视图 */
       #viewerView {
           display: none;
           position: fixed;
           top: 0; left: 0; right: 0; bottom: 0;
           background: #000;
           z-index: 100;
       }
       #viewerIframe {
           width: 100%;
           height: 100%;
           border: none;
           background: #fff;
       }

       /* 悬浮球 */
       #floatBall {
           display: none;
           position: fixed;
           width: 64px;
           height: 64px;
           border-radius: 50%;
           background: linear-gradient(135deg, #ef4444, #dc2626);
           color: white;
           font-size: 13px;
           font-weight: 600;
           align-items: center;
           justify-content: center;
           cursor: pointer;
           z-index: 10000;
           box-shadow: 0 4px 20px rgba(220,38,38,0.4), 0 0 0 4px rgba(220,38,38,0.1);
           letter-spacing: 1px;
           touch-action: none;
           transition: transform 0.2s, box-shadow 0.2s;
       }
       #floatBall:active {
           transform: scale(0.92);
           box-shadow: 0 2px 10px rgba(220,38,38,0.3);
       }

       /* 弹窗 */
       #modalOverlay {
           display: none;
           position: fixed;
           top: 0; left: 0; right: 0; bottom: 0;
           background: rgba(0,0,0,0.7);
           backdrop-filter: blur(8px);
           z-index: 10001;
           align-items: center;
           justify-content: center;
           animation: fadeIn 0.2s;
       }
       .modal-box {
           background: linear-gradient(135deg, #1e1e3f, #2d2d5a);
           border: 1px solid rgba(255,255,255,0.1);
           border-radius: 20px;
           padding: 32px;
           width: 90%;
           max-width: 360px;
           text-align: center;
           box-shadow: 0 20px 60px rgba(0,0,0,0.5);
           animation: scaleIn 0.2s;
       }
       .modal-box h3 {
           font-size: 1.3rem;
           margin-bottom: 12px;
           color: #fff;
       }
       .modal-box p {
           color: #8892b0;
           margin-bottom: 24px;
           font-size: 0.95rem;
       }
       .modal-btns {
           display: flex;
           gap: 12px;
           justify-content: center;
       }
       .modal-btns button {
           padding: 10px 24px;
           border-radius: 10px;
           border: none;
           font-size: 0.95rem;
           cursor: pointer;
           transition: all 0.2s;
           font-weight: 500;
       }
       .btn-cancel {
           background: rgba(255,255,255,0.08);
           color: #8892b0;
       }
       .btn-cancel:hover { background: rgba(255,255,255,0.15); }
       .btn-confirm {
           background: linear-gradient(135deg, #ef4444, #dc2626);
           color: white;
       }
       .btn-confirm:hover {
           transform: translateY(-1px);
           box-shadow: 0 4px 12px rgba(220,38,38,0.3);
       }

       @keyframes fadeInDown {
           from { opacity: 0; transform: translateY(-20px); }
           to { opacity: 1; transform: translateY(0); }
       }
       @keyframes fadeInUp {
           from { opacity: 0; transform: translateY(20px); }
           to { opacity: 1; transform: translateY(0); }
       }
       @keyframes fadeIn {
           from { opacity: 0; }
           to { opacity: 1; }
       }
       @keyframes scaleIn {
           from { opacity: 0; transform: scale(0.9); }
           to { opacity: 1; transform: scale(1); }
       }
       @keyframes spin {
           to { transform: rotate(360deg); }
       }
   </style>
</head>
<body>

   <!-- 列表视图 -->
   <div id="listView">
       <div class="header">
           <h1>作品列表</h1>
           <p>检测到当前目录中的名次文件（1.html ~ 30.html）</p>
       </div>
       <div id="fileList" class="loading">正在扫描目录</div>
   </div>

   <!-- 阅览视图 -->
   <div id="viewerView">
       <iframe id="viewerIframe"></iframe>
   </div>

   <!-- 悬浮球 -->
   <div id="floatBall">退出</div>

   <!-- 退出确认弹窗 -->
   <div id="modalOverlay">
       <div class="modal-box">
           <h3>确认退出</h3>
           <p>是否返回到作品列表？</p>
           <div class="modal-btns">
               <button class="btn-cancel" onclick="hideModal()">取消</button>
               <button class="btn-confirm" onclick="confirmExit()">确认退出</button>
           </div>
       </div>
   </div>

   <script>
       // 检测文件存在性
       async function detectFiles() {
           const promises = [];
           for (let i = 1; i <= 30; i++) {
               promises.push(
                   fetch(`./${i}.html`, { method: 'HEAD', cache: 'no-store' })
                       .then(res => res.ok ? i : null)
                       .catch(() => null)
               );
           }
           const results = await Promise.all(promises);
           return results.filter(x => x !== null).sort((a, b) => a - b);
       }

       // 渲染列表
       function renderList(files) {
           const container = document.getElementById('fileList');
           container.className = 'file-grid';
           
           if (files.length === 0) {
               container.innerHTML = `
                   <div class="empty">
                       <div class="empty-icon">📂</div>
                       <div>未检测到 1~30.html 文件</div>
                       <div style="font-size:0.85rem; margin-top:8px;">请将作品文件放置于同目录后刷新页面</div>
                   </div>
               `;
               return;
           }
           
           container.innerHTML = '';
           files.forEach(rank => {
               const item = document.createElement('div');
               item.className = 'file-item';
               item.innerHTML = `
                   <div class="rank-num">${rank}</div>
                   <div class="rank-label">第 ${rank} 名</div>
               `;
               item.addEventListener('click', () => openViewer(rank));
               container.appendChild(item);
           });
       }

       // 打开阅览器
       function openViewer(rank) {
           document.getElementById('listView').style.display = 'none';
           document.getElementById('viewerView').style.display = 'block';
           document.getElementById('viewerIframe').src = `./${rank}.html`;
           
           const ball = document.getElementById('floatBall');
           ball.style.display = 'flex';
           
           // 初始居中
           const x = (window.innerWidth - 64) / 2;
           const y = (window.innerHeight - 64) / 2;
           ball.style.left = x + 'px';
           ball.style.top = y + 'px';
       }

       // 退出确认
       function confirmExit() {
           document.getElementById('viewerIframe').src = '';
           document.getElementById('viewerView').style.display = 'none';
           document.getElementById('listView').style.display = 'block';
           document.getElementById('floatBall').style.display = 'none';
           hideModal();
       }

       // 弹窗控制
       function showModal() {
           document.getElementById('modalOverlay').style.display = 'flex';
       }
       function hideModal() {
           document.getElementById('modalOverlay').style.display = 'none';
       }
       document.getElementById('modalOverlay').addEventListener('click', (e) => {
           if (e.target === document.getElementById('modalOverlay')) hideModal();
       });

       // 悬浮球拖拽与点击逻辑
       (function initFloatBall() {
           const ball = document.getElementById('floatBall');
           let state = {
               dragging: false,
               startTime: 0,
               startX: 0,
               startY: 0,
               offsetX: 0,
               offsetY: 0,
               hasMoved: false
           };

           function onStart(e) {
               e.preventDefault();
               const touch = e.touches ? e.touches[0] : e;
               const rect = ball.getBoundingClientRect();
               
               state.dragging = true;
               state.startTime = Date.now();
               state.startX = touch.clientX;
               state.startY = touch.clientY;
               state.offsetX = touch.clientX - rect.left;
               state.offsetY = touch.clientY - rect.top;
               state.hasMoved = false;
               
               ball.style.transition = 'none';
           }

           function onMove(e) {
               if (!state.dragging) return;
               e.preventDefault();
               const touch = e.touches ? e.touches[0] : e;
               
               // 检测是否发生移动（超过5px视为拖动）
               if (Math.abs(touch.clientX - state.startX) > 5 || Math.abs(touch.clientY - state.startY) > 5) {
                   state.hasMoved = true;
               }
               
               let x = touch.clientX - state.offsetX;
               let y = touch.clientY - state.offsetY;
               
               // 边界限制
               const maxX = window.innerWidth - ball.offsetWidth;
               const maxY = window.innerHeight - ball.offsetHeight;
               x = Math.max(0, Math.min(x, maxX));
               y = Math.max(0, Math.min(y, maxY));
               
               ball.style.left = x + 'px';
               ball.style.top = y + 'px';
           }

           function onEnd() {
               if (!state.dragging) return;
               state.dragging = false;
               ball.style.transition = 'transform 0.2s, box-shadow 0.2s';
               
               const duration = Date.now() - state.startTime;
               // 未发生移动且按下时间不超过400ms，触发弹窗
               if (!state.hasMoved && duration < 400) {
                   showModal();
               }
           }

           ball.addEventListener('mousedown', onStart);
           document.addEventListener('mousemove', onMove);
           document.addEventListener('mouseup', onEnd);
           
           ball.addEventListener('touchstart', onStart, { passive: false });
           document.addEventListener('touchmove', onMove, { passive: false });
           document.addEventListener('touchend', onEnd);
       })();

       // 初始化
       detectFiles().then(renderList);
   </script>
</body>
</html>
