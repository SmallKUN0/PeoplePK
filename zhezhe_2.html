<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>苏西的餐厅 - 三关卡恐怖冒险</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { overflow: hidden; background: #000; font-family: 'Microsoft YaHei', sans-serif; touch-action: none; height: 100%; }
#gameCanvas { display: block; width: 100%; height: 100%; }

#mainMenu {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: #0a0a0a; display: flex; flex-direction: column;
    align-items: center; justify-content: center; z-index: 100;
}
#mainMenu h1 { font-size: 52px; color: #ff3333; text-shadow: 0 0 30px #ff0000; margin-bottom: 10px; animation: flicker 2s infinite; cursor: pointer; user-select: none; }
.subtitle { font-size: 20px; color: #888; margin-bottom: 40px; letter-spacing: 8px; }
@keyframes flicker { 0%,100%{opacity:1} 50%{opacity:0.6} }

.menu-btn {
    padding: 18px 60px; font-size: 24px; background: #1a1a1a; color: #ff3333;
    border: 3px solid #ff3333; border-radius: 8px; cursor: pointer;
    transition: all 0.3s; font-family: 'Microsoft YaHei', sans-serif; letter-spacing: 4px;
    -webkit-tap-highlight-color: transparent; margin: 8px;
}
.menu-btn:hover, .menu-btn:active { background: #ff3333; color: #000; box-shadow: 0 0 40px #ff0000; transform: scale(1.05); }

.instructions { color: #666; font-size: 15px; margin-top: 30px; text-align: center; line-height: 2.2; }
.instructions span { color: #ff6666; }

#levelSelect {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: #0a0a0a; display: none; flex-direction: column;
    align-items: center; justify-content: center; z-index: 100;
}
#levelSelect h1 { font-size: 40px; color: #ff3333; margin-bottom: 30px; text-shadow: 0 0 20px #ff0000; }
.level-grid { display: flex; gap: 25px; flex-wrap: wrap; justify-content: center; margin-bottom: 30px; }
.level-card {
    width: 160px; height: 200px; background: #1a1a1a; border: 3px solid #444;
    border-radius: 15px; display: flex; flex-direction: column;
    align-items: center; justify-content: center; cursor: pointer;
    transition: all 0.3s; position: relative; overflow: hidden;
}
.level-card:hover { border-color: #ff3333; box-shadow: 0 0 30px rgba(255,51,51,0.4); transform: translateY(-5px); }
.level-card.locked { opacity: 0.3; pointer-events: none; border-color: #333; }
.level-card .level-icon { font-size: 48px; margin-bottom: 10px; }
.level-card .level-num { font-size: 22px; color: #ff3333; font-weight: bold; }
.level-card .level-name { font-size: 14px; color: #888; margin-top: 5px; }
.level-card .egg-badge { position: absolute; top: 8px; right: 8px; font-size: 20px; animation: bounce 1s infinite; }
@keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-4px)} }

#gameOverScreen {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: #000; display: none; flex-direction: column;
    align-items: center; justify-content: center; z-index: 200;
}
#gameOverScreen h1 { font-size: 64px; color: #ff0000; text-shadow: 0 0 40px #ff0000; margin-bottom: 15px; animation: shake 0.3s infinite; }
#gameOverScreen .sub-text { font-size: 28px; color: #ff3333; margin-bottom: 30px; }
@keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-15px)} 75%{transform:translateX(15px)} }

#victoryScreen {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: #0a0a0a; display: none; flex-direction: column;
    align-items: center; justify-content: center; z-index: 200;
}
#victoryScreen h1 { font-size: 52px; color: #00ff00; text-shadow: 0 0 30px #00ff00; margin-bottom: 20px; }
#victoryScreen .sub-text { font-size: 22px; color: #aaa; margin-bottom: 30px; }

#eggScreen {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: #000; display: none; flex-direction: column;
    align-items: center; justify-content: center; z-index: 300;
}
#eggScreen h1 { font-size: 44px; color: #FFD700; text-shadow: 0 0 30px #FFD700; margin-bottom: 20px; animation: pulse 1s infinite; }
#eggScreen .sub-text { font-size: 20px; color: #ccc; margin-bottom: 30px; text-align: center; max-width: 500px; line-height: 1.8; }
@keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.8;transform:scale(1.05)} }

#scoreBoard {
    position: absolute; top: 15px; left: 15px; font-size: 20px; color: #ff3333;
    background: rgba(0,0,0,0.85); padding: 12px 20px; border-radius: 8px;
    z-index: 50; display: none; border: 2px solid #ff3333;
}

#levelBoard {
    position: absolute; top: 15px; right: 15px; font-size: 18px; color: #FFD700;
    background: rgba(0,0,0,0.85); padding: 10px 18px; border-radius: 8px;
    z-index: 50; display: none; border: 2px solid #FFD700;
}

#warningText {
    position: absolute; top: 30%; left: 50%; transform: translate(-50%, -50%);
    font-size: 36px; color: #ff0000; text-shadow: 0 0 20px #ff0000;
    z-index: 60; display: none; pointer-events: none; animation: pulse 0.6s infinite;
}

#hintText {
    position: absolute; bottom: 70px; left: 50%; transform: translateX(-50%);
    color: #FFD700; font-size: 16px; z-index: 60; display: none; text-align: center;
    background: rgba(0,0,0,0.8); padding: 10px 20px; border-radius: 10px; border: 2px solid #FFD700;
    max-width: 80%; line-height: 1.5;
}

#interactHint {
    position: absolute; top: 45%; left: 50%; transform: translate(-50%, -50%);
    font-size: 22px; color: #00ff00; text-shadow: 0 0 15px #00ff00;
    z-index: 65; display: none; pointer-events: none;
    background: rgba(0,0,0,0.8); padding: 12px 24px; border-radius: 10px; border: 2px solid #00ff00;
}

#joystick {
    position: absolute; bottom: 100px; left: 50%;
    transform: translateX(-50%); width: 180px; height: 180px; z-index: 70; display: none;
}
#joystickBase { position: absolute; width: 180px; height: 180px; border-radius: 50%; background: rgba(255,255,255,0.08); border: 2px solid rgba(255,255,255,0.2); }
#joystickKnob { position: absolute; width: 70px; height: 70px; border-radius: 50%; background: rgba(255,255,255,0.3); border: 2px solid rgba(255,255,255,0.5); top: 55px; left: 55px; transition: none; }

#touchHint { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); color: #666; font-size: 14px; z-index: 70; display: none; }

#crosshair {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 20px; height: 20px; z-index: 55; pointer-events: none; display: none;
}
#crosshair::before, #crosshair::after {
    content: ''; position: absolute; background: rgba(255,255,255,0.5);
}
#crosshair::before { width: 2px; height: 20px; left: 9px; top: 0; }
#crosshair::after { width: 20px; height: 2px; left: 0; top: 9px; }
</style>
</head>
<body>

<div id="mainMenu">
    <h1>苏西的餐厅</h1>
    <div class="subtitle">SUSIE'S RESTAURANT</div>
    <button class="menu-btn" id="startBtn">开始游戏</button>
    <div class="instructions">
        <p>WASD / 方向键 移动角色</p>
        <p>E 键 与彩蛋物品交互</p>
        <p>收集所有披萨逃离餐厅</p>
        <p>寻找隐藏彩蛋，解锁苏西的学校！</p>
    </div>
</div>

<div id="levelSelect">
    <h1>选择关卡</h1>
    <div class="level-grid">
        <div class="level-card" id="card1" onclick="selectLevel(1)">
            <div class="egg-badge" id="badge1" style="display:none">🥚</div>
            <div class="level-icon">🍕</div>
            <div class="level-num">第 1 关</div>
            <div class="level-name">苏西的餐厅</div>
        </div>
        <div class="level-card locked" id="card2" onclick="selectLevel(2)">
            <div class="egg-badge" id="badge2" style="display:none">🥚</div>
            <div class="level-icon">🥛</div>
            <div class="level-num">第 2 关</div>
            <div class="level-name">超市大逃亡</div>
        </div>
        <div class="level-card locked" id="card3" onclick="selectLevel(3)">
            <div class="egg-badge" id="badge3" style="display:none">🥚</div>
            <div class="level-icon">🥤</div>
            <div class="level-num">第 3 关</div>
            <div class="level-name">饮料店惊魂</div>
        </div>
    </div>
    <button class="menu-btn" onclick="goToMenu()" style="font-size:18px;padding:12px 40px;">返回主菜单</button>
</div>

<div id="gameOverScreen">
    <h1>妈妈咪呀！</h1>
    <div class="sub-text">苏西抓住了你！</div>
    <button class="menu-btn" onclick="goToMenu()">返回菜单</button>
    <button class="menu-btn" onclick="retryLevel()" style="margin-top:10px;font-size:18px;padding:12px 40px;">重试</button>
</div>

<div id="victoryScreen">
    <h1 id="victoryTitle">你逃出来了！</h1>
    <div class="sub-text" id="victorySub">成功收集了所有披萨</div>
    <button class="menu-btn" id="victoryBtn">下一关</button>
</div>

<div id="eggScreen">
    <h1 id="eggTitle">彩蛋触发！</h1>
    <div class="sub-text" id="eggSub">你发现了隐藏的秘密...</div>
    <button class="menu-btn" id="eggBtn">继续冒险</button>
</div>

<div id="scoreBoard">🍕 <span id="score">0</span> / <span id="total">8</span></div>
<div id="levelBoard">第 <span id="currentLevel">1</span> 关</div>
<div id="warningText">苏西在附近！</div>
<div id="hintText"></div>
<div id="interactHint">按 E 交互</div>
<div id="crosshair"></div>

<div id="joystick">
    <div id="joystickBase"></div>
    <div id="joystickKnob"></div>
</div>
<div id="touchHint">拖动圆盘移动</div>

<canvas id="gameCanvas"></canvas>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
resizeCanvas();

let gameState = 'menu', currentLevel = 1, unlockedLevels = 1;
let score = 0, totalItems = 8, frameCount = 0, warningTimer = 0, hintTimer = 0;
let eggsFound = {1: false, 2: false, 3: false};

const player = { x: 100, y: 100, width: 28, height: 28, speed: 3.5, dir: 0 };
const susie = { x: 0, y: 0, width: 40, height: 90, speed: 1.0, chaseSpeed: 1.8, state: 'patrol', patrolTarget: {x: 0, y: 0}, patrolTimer: 0, animFrame: 0 };

let items = [], walls = [], shelves = [], interactables = [], particles = [];
const keys = {}, keyCodes = {};
let flashlightRadius = 300;
let touchActive = false, touchStartX = 0, touchStartY = 0, joystickDX = 0, joystickDY = 0;

const levelConfigs = {
    1: { name: '苏西的餐厅', total: 8, susieSpeed: 1.0, susieChase: 1.8, detect: 180, bgColor: '#1a1a2e', floorColor1: '#2a2a3e', floorColor2: '#252535', wallColor: '#0a0a15', shelfColor: '#3a2a1a', hint: '找找看... 角落里有个马桶？🚽', egg: { type: 'toilet', name: '马桶', desc: '你冲了马桶，水流旋转着把你吸了进去...欢迎来到苏西的学校第一关！' }},
    2: { name: '超市大逃亡', total: 10, susieSpeed: 1.3, susieChase: 2.2, detect: 200, bgColor: '#1a2a3a', floorColor1: '#2a3a4a', floorColor2: '#253545', wallColor: '#0a1a2a', shelfColor: '#4a4a3a', hint: '仓库深处藏着一箱牛奶...🥛', egg: { type: 'milk', name: '牛奶箱', desc: '你喝下了仓库里的牛奶...味道有点奇怪...欢迎来到苏西的学校第二关！' }},
    3: { name: '饮料店惊魂', total: 12, susieSpeed: 1.5, susieChase: 2.5, detect: 220, bgColor: '#2a1a2e', floorColor1: '#3a2a3e', floorColor2: '#352535', wallColor: '#1a0a1a', shelfColor: '#4a2a4a', hint: '吧台后面有一杯神秘饮料...🥤', egg: { type: 'drink', name: '神秘饮料', desc: '你喝下了那杯饮料...世界开始旋转...欢迎来到苏西的学校第三关！' }}
};

function drawSusie(ctx, x, y, w, h, frame, isChasing) {
    ctx.save();
    ctx.translate(x, y);
    const walkOffset = Math.sin(frame * 0.12) * 5;
    const armSwing = Math.sin(frame * 0.12) * 15;
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.beginPath(); ctx.ellipse(0, h/2 + 5, w/2 + 5, 8, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#FFD700';
    ctx.fillRect(-10, h/2 - 15 + walkOffset, 8, 28);
    ctx.fillRect(2, h/2 - 15 - walkOffset, 8, 28);
    ctx.fillStyle = '#333';
    ctx.fillRect(-12, h/2 + 10, 12, 6);
    ctx.fillRect(2, h/2 + 10, 12, 6);
    ctx.fillStyle = '#FFFFFF';
    ctx.beginPath();
    ctx.moveTo(-w/2, -h/4); ctx.lineTo(w/2, -h/4); ctx.lineTo(w/2 + 6, h/2 - 10); ctx.lineTo(-w/2 - 6, h/2 - 10); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#CCCCCC'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(-w/2, -h/4 + 15); ctx.lineTo(w/2, -h/4 + 15); ctx.stroke();
    ctx.strokeStyle = '#BBBBBB'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(-w/2, -h/4); ctx.lineTo(-w/2 - 8, -h/4 - 12); ctx.moveTo(w/2, -h/4); ctx.lineTo(w/2 + 8, -h/4 - 12); ctx.stroke();
    ctx.fillStyle = '#FFD700';
    ctx.save(); ctx.translate(-w/2 - 6, -h/4 + 5); ctx.rotate((armSwing * Math.PI) / 180); ctx.fillRect(-4, 0, 8, 30); ctx.restore();
    ctx.save(); ctx.translate(w/2 + 6, -h/4 + 5); ctx.rotate((-armSwing * Math.PI) / 180); ctx.fillRect(-4, 0, 8, 30); ctx.restore();
    const headY = -h/3 - 12;
    ctx.fillStyle = '#FFD700';
    ctx.beginPath(); ctx.arc(0, headY, w/2 + 4, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#DAA520'; ctx.lineWidth = 2; ctx.stroke();
    const hatBaseY = headY - w/2 - 4, hatHeight = 30, hatTopY = hatBaseY - hatHeight, hatWidth = w/2 + 6;
    ctx.fillStyle = '#FFFFFF';
    ctx.beginPath(); ctx.ellipse(0, hatBaseY, hatWidth + 6, 6, 0, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#CCCCCC'; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = '#FFFFFF';
    ctx.beginPath(); ctx.moveTo(-hatWidth, hatBaseY); ctx.lineTo(hatWidth, hatBaseY); ctx.lineTo(hatWidth - 3, hatTopY); ctx.lineTo(-hatWidth + 3, hatTopY); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#DDDDDD'; ctx.lineWidth = 1; ctx.stroke();
    ctx.fillStyle = '#FFFFFF';
    ctx.beginPath(); ctx.ellipse(0, hatTopY, hatWidth - 3, 5, 0, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#CCCCCC'; ctx.lineWidth = 1; ctx.stroke();
    ctx.fillStyle = '#000000';
    ctx.beginPath(); ctx.arc(-9, headY, 7, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(9, headY, 7, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#FFFFFF';
    ctx.beginPath(); ctx.arc(-7, headY - 3, 3, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(11, headY - 3, 3, 0, Math.PI * 2); ctx.fill();
    if (isChasing) {
        ctx.fillStyle = '#000000';
        ctx.beginPath(); ctx.ellipse(0, headY + 12, 10, 8, 0, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#FFFFFF';
        for (let i = -8; i <= 8; i += 4) { ctx.fillRect(i - 1, headY + 8, 2, 4); }
    } else {
        ctx.fillStyle = '#000000';
        ctx.beginPath(); ctx.ellipse(0, headY + 10, 6, 4, 0, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
}

function drawToilet(ctx, x, y, w, h) {
    ctx.save(); ctx.translate(x, y);
    ctx.fillStyle = '#E8E8E8'; ctx.fillRect(-w/2, -h/2 + 10, w, h - 10);
    ctx.strokeStyle = '#CCCCCC'; ctx.lineWidth = 2; ctx.strokeRect(-w/2, -h/2 + 10, w, h - 10);
    ctx.fillStyle = '#F0F0F0'; ctx.fillRect(-w/2 + 3, -h/2 - 18, w - 6, 20);
    ctx.strokeStyle = '#CCCCCC'; ctx.lineWidth = 1; ctx.strokeRect(-w/2 + 3, -h/2 - 18, w - 6, 20);
    ctx.fillStyle = '#4169E1'; ctx.beginPath(); ctx.arc(0, -h/2 - 10, 5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#FFFFFF'; ctx.beginPath(); ctx.ellipse(0, -5, w/2 - 4, h/2 - 8, 0, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#CCCCCC'; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = '#87CEEB'; ctx.beginPath(); ctx.ellipse(0, -5, w/2 - 10, h/2 - 14, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#FFD700'; ctx.font = 'bold 16px Arial'; ctx.textAlign = 'center'; ctx.fillText('?', 0, -h/2 - 25);
    ctx.restore();
}

function drawMilkBox(ctx, x, y, w, h) {
    ctx.save(); ctx.translate(x, y);
    ctx.fillStyle = '#F5F5DC'; ctx.fillRect(-w/2, -h/2, w, h);
    ctx.strokeStyle = '#D2B48C'; ctx.lineWidth = 2; ctx.strokeRect(-w/2, -h/2, w, h);
    ctx.fillStyle = '#FFFFFF'; ctx.fillRect(-8, -h/2 - 15, 16, 22);
    ctx.fillStyle = '#87CEEB'; ctx.fillRect(-6, -h/2 - 10, 12, 12);
    ctx.fillStyle = '#FF6347'; ctx.fillRect(-7, -h/2 - 18, 14, 4);
    ctx.fillStyle = '#4169E1'; ctx.font = 'bold 11px Arial'; ctx.textAlign = 'center'; ctx.fillText('MILK', 0, 2);
    ctx.fillStyle = '#FFD700'; ctx.font = 'bold 16px Arial'; ctx.fillText('?', 0, -h/2 - 25);
    ctx.restore();
}

function drawDrinkCup(ctx, x, y, w, h) {
    ctx.save(); ctx.translate(x, y);
    const glow = Math.sin(frameCount * 0.08) * 8 + 12;
    ctx.shadowColor = '#FF00FF'; ctx.shadowBlur = glow;
    ctx.fillStyle = '#FF1493';
    ctx.beginPath(); ctx.moveTo(-w/2, -h/2); ctx.lineTo(w/2, -h/2); ctx.lineTo(w/2 - 5, h/2); ctx.lineTo(-w/2 + 5, h/2); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#C71585'; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = '#FF6347'; ctx.fillRect(-w/2 - 3, -h/2 - 5, w + 6, 6);
    ctx.strokeStyle = '#FFD700'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(0, -h/2 - 5); ctx.lineTo(10, -h/2 - 20); ctx.stroke();
    ctx.fillStyle = '#FFFFFF'; ctx.globalAlpha = 0.6;
    ctx.beginPath(); ctx.arc(-3, 0, 2, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(5, 5, 1.5, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1; ctx.shadowBlur = 0;
    ctx.fillStyle = '#FFD700'; ctx.font = 'bold 16px Arial'; ctx.textAlign = 'center'; ctx.fillText('?', 0, -h/2 - 28);
    ctx.restore();
}

function initLevel(levelNum) {
    const cfg = levelConfigs[levelNum];
    currentLevel = levelNum; totalItems = cfg.total; score = 0;
    items = []; walls = []; shelves = []; interactables = []; particles = [];
    const w = canvas.width, h = canvas.height;
    walls.push({x: 0, y: 0, w: w, h: 30}); walls.push({x: 0, y: h-30, w: w, h: 30});
    walls.push({x: 0, y: 0, w: 30, h: h}); walls.push({x: w-30, y: 0, w: 30, h: h});
    if (levelNum === 1) {
        const shelfW = 40, shelfH = 80;
        for (let i = 0; i < 3; i++) { shelves.push({x: 60, y: 80 + i * 140, w: shelfW, h: shelfH}); shelves.push({x: w - 100, y: 80 + i * 140, w: shelfW, h: shelfH}); }
        shelves.push({x: w/2 - 20, y: 100, w: shelfW, h: shelfH}); shelves.push({x: w/2 - 20, y: 280, w: shelfW, h: shelfH});
        shelves.push({x: w/2 - 80, y: h - 90, w: 160, h: 40}); shelves.push({x: 150, y: h - 160, w: 60, h: 60});
        interactables.push({x: w - 80, y: h - 80, w: 35, h: 40, type: 'toilet', used: false});
    } else if (levelNum === 2) {
        const aisleW = 50, aisleH = 100;
        for (let row = 0; row < 4; row++) { for (let col = 0; col < 2; col++) { shelves.push({x: 80 + col * (w/2 - 60), y: 60 + row * 130, w: aisleW, h: aisleH}); } }
        walls.push({x: w/2 - 5, y: 50, w: 10, h: h - 100}); shelves.push({x: w - 120, y: h/2 - 40, w: 80, h: 80});
        interactables.push({x: w - 80, y: h/2, w: 40, h: 35, type: 'milk', used: false});
    } else if (levelNum === 3) {
        shelves.push({x: w/2 - 100, y: 60, w: 200, h: 50});
        walls.push({x: w/4, y: h/3, w: 25, h: 25}); walls.push({x: w*3/4, y: h/3, w: 25, h: 25});
        walls.push({x: w/4, y: h*2/3, w: 25, h: 25}); walls.push({x: w*3/4, y: h*2/3, w: 25, h: 25});
        for (let i = 0; i < 3; i++) { shelves.push({x: 80 + i * 120, y: h - 130, w: 50, h: 50}); }
        interactables.push({x: w/2, y: 120, w: 25, h: 35, type: 'drink', used: false});
    }
    initItems(w, h);
    player.x = 60; player.y = 60; susie.x = w - 100; susie.y = h - 100;
    susie.state = 'patrol'; susie.patrolTarget = {x: w/2, y: h/2}; susie.patrolTimer = 0;
    susie.speed = cfg.susieSpeed; susie.chaseSpeed = cfg.susieChase;
}

function initItems(w, h) {
    items = []; let positions = [];
    if (currentLevel === 1) {
        positions = [{x: 120, y: 120}, {x: w - 120, y: 120}, {x: 120, y: h - 120}, {x: w - 120, y: h - 120}, {x: w/2, y: 80}, {x: w/2, y: h - 120}, {x: 280, y: h/2}, {x: w - 280, y: h/2}];
    } else if (currentLevel === 2) {
        positions = [{x: 100, y: 100}, {x: w - 100, y: 100}, {x: 100, y: h - 100}, {x: w - 100, y: h - 100}, {x: w/2, y: 80}, {x: w/2, y: h - 100}, {x: w/3, y: h/2}, {x: w*2/3, y: h/2}, {x: 200, y: 200}, {x: w - 200, y: h - 200}];
    } else {
        positions = [{x: 80, y: 80}, {x: w - 80, y: 80}, {x: 80, y: h - 80}, {x: w - 80, y: h - 80}, {x: w/2, y: 150}, {x: w/2, y: h - 80}, {x: w/4, y: h/3}, {x: w*3/4, y: h/3}, {x: w/4, y: h*2/3}, {x: w*3/4, y: h*2/3}, {x: w/2, y: h/2}, {x: 150, y: h - 150}];
    }
    for (let pos of positions) { items.push({x: pos.x, y: pos.y, size: 18, collected: false, angle: Math.random() * Math.PI * 2}); }
}

function rectCollision(r1, r2) { return r1.x < r2.x + r2.w && r1.x + r1.w > r2.x && r1.y < r2.y + r2.h && r1.y + r1.h > r2.y; }
function checkWallCollision(newX, newY) {
    const playerRect = {x: newX - player.width/2, y: newY - player.height/2, w: player.width, h: player.height};
    for (let wall of walls) { if (rectCollision(playerRect, wall)) return true; }
    for (let shelf of shelves) { if (rectCollision(playerRect, shelf)) return true; }
    return false;
}

function updatePlayer() {
    let dx = 0, dy = 0;
    if (keys['ArrowUp'] || keys['w'] || keys['W'] || keyCodes['38']) dy = -player.speed;
    if (keys['ArrowDown'] || keys['s'] || keys['S'] || keyCodes['40']) dy = player.speed;
    if (keys['ArrowLeft'] || keys['a'] || keys['A'] || keyCodes['37']) dx = -player.speed;
    if (keys['ArrowRight'] || keys['d'] || keys['D'] || keyCodes['39']) dx = player.speed;
    if (touchActive) { dx = joystickDX * player.speed; dy = joystickDY * player.speed; }
    if (dx !== 0 && dy !== 0) { dx *= 0.707; dy *= 0.707; }
    if (dx !== 0 || dy !== 0) { player.dir = Math.atan2(dy, dx); }
    let newX = player.x + dx; if (!checkWallCollision(newX, player.y)) player.x = newX;
    let newY = player.y + dy; if (!checkWallCollision(player.x, newY)) player.y = newY;
    player.x = Math.max(40, Math.min(canvas.width - 40, player.x));
    player.y = Math.max(40, Math.min(canvas.height - 40, player.y));
}

function updateSusie() {
    const dx = player.x - susie.x, dy = player.y - susie.y;
    const distance = Math.sqrt(dx * dx + dy * dy);
    const cfg = levelConfigs[currentLevel];
    if (distance < cfg.detect) { susie.state = 'chase'; warningTimer = 60; } else { susie.state = 'patrol'; }
    let moveSpeed = susie.state === 'chase' ? susie.chaseSpeed : susie.speed;
    if (susie.state === 'chase') {
        if (distance > 0) {
            const moveX = (dx / distance) * moveSpeed, moveY = (dy / distance) * moveSpeed;
            let newX = susie.x + moveX, newY = susie.y + moveY;
            const susieRect = {x: newX - susie.width/2, y: newY - susie.height/2, w: susie.width, h: susie.height};
            let blocked = false;
            for (let wall of walls) { if (rectCollision(susieRect, wall)) { blocked = true; break; } }
            for (let shelf of shelves) { if (rectCollision(susieRect, shelf)) { blocked = true; break; } }
            if (!blocked) { susie.x = newX; susie.y = newY; }
        }
    } else {
        susie.patrolTimer++;
        if (susie.patrolTimer > 120 || (Math.abs(susie.x - susie.patrolTarget.x) < 15 && Math.abs(susie.y - susie.patrolTarget.y) < 15)) {
            susie.patrolTarget = {x: 60 + Math.random() * (canvas.width - 120), y: 60 + Math.random() * (canvas.height - 120)};
            susie.patrolTimer = 0;
        }
        const pdx = susie.patrolTarget.x - susie.x, pdy = susie.patrolTarget.y - susie.y;
        const pdist = Math.sqrt(pdx * pdx + pdy * pdy);
        if (pdist > 0) {
            const moveX = (pdx / pdist) * moveSpeed * 0.5, moveY = (pdy / pdist) * moveSpeed * 0.5;
            let newX = susie.x + moveX, newY = susie.y + moveY;
            const susieRect = {x: newX - susie.width/2, y: newY - susie.height/2, w: susie.width, h: susie.height};
            let blocked = false;
            for (let wall of walls) { if (rectCollision(susieRect, wall)) { blocked = true; break; } }
            for (let shelf of shelves) { if (rectCollision(susieRect, shelf)) { blocked = true; break; } }
            if (!blocked) { susie.x = newX; susie.y = newY; } else { susie.patrolTimer = 120; }
        }
    }
    susie.animFrame++;
}

function checkCollection() {
    for (let item of items) {
        if (!item.collected) {
            const dx = player.x - item.x, dy = player.y - item.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < player.width/2 + item.size + 5) {
                item.collected = true; score++;
                document.getElementById('score').textContent = score;
                for (let i = 0; i < 10; i++) {
                    particles.push({x: item.x, y: item.y, vx: (Math.random() - 0.5) * 5, vy: (Math.random() - 0.5) * 5, life: 40, color: '#FFD700', size: Math.random() * 4 + 2});
                }
                if (score >= totalItems) {
                    gameState = 'victory';
                    document.getElementById('victoryScreen').style.display = 'flex';
                    document.getElementById('scoreBoard').style.display = 'none';
                    document.getElementById('levelBoard').style.display = 'none';
                    document.getElementById('joystick').style.display = 'none';
                    document.getElementById('touchHint').style.display = 'none';
                    document.getElementById('crosshair').style.display = 'none';
                    document.getElementById('hintText').style.display = 'none';
                    document.getElementById('interactHint').style.display = 'none';
                    if (currentLevel < 3) {
                        unlockedLevels = Math.max(unlockedLevels, currentLevel + 1);
                        document.getElementById('victoryTitle').textContent = '关卡完成！';
                        document.getElementById('victorySub').textContent = '第' + currentLevel + '关通过！解锁第' + (currentLevel+1) + '关';
                        document.getElementById('victoryBtn').textContent = '下一关';
                    } else {
                        document.getElementById('victoryTitle').textContent = '全部通关！';
                        document.getElementById('victorySub').textContent = '恭喜你通过了所有关卡！';
                        document.getElementById('victoryBtn').textContent = '返回主菜单';
                    }
                }
            }
        }
    }
}

function checkInteraction() {
    let nearInteractable = false;
    for (let inter of interactables) {
        if (inter.used) continue;
        const dx = player.x - inter.x, dy = player.y - inter.y;
        if (Math.sqrt(dx*dx + dy*dy) < 45) { nearInteractable = true; document.getElementById('interactHint').style.display = 'block'; return inter; }
    }
    if (!nearInteractable) { document.getElementById('interactHint').style.display = 'none'; }
    return null;
}

function triggerEgg() {
    const inter = checkInteraction();
    if (!inter || inter.used) return;
    inter.used = true; eggsFound[currentLevel] = true;
    const cfg = levelConfigs[currentLevel];
    for (let i = 0; i < 20; i++) {
        particles.push({x: inter.x, y: inter.y, vx: (Math.random() - 0.5) * 8, vy: (Math.random() - 0.5) * 8, life: 60, color: '#00FFFF', size: Math.random() * 5 + 3});
    }
    gameState = 'egg';
    document.getElementById('eggTitle').textContent = '🎉 ' + cfg.egg.name + '彩蛋触发！';
    document.getElementById('eggSub').textContent = cfg.egg.desc;
    document.getElementById('eggScreen').style.display = 'flex';
    document.getElementById('scoreBoard').style.display = 'none';
    document.getElementById('levelBoard').style.display = 'none';
    document.getElementById('joystick').style.display = 'none';
    document.getElementById('touchHint').style.display = 'none';
    document.getElementById('crosshair').style.display = 'none';
    document.getElementById('hintText').style.display = 'none';
    document.getElementById('interactHint').style.display = 'none';
    document.getElementById('badge' + currentLevel).style.display = 'block';
}

function checkCaught() {
    const dx = player.x - susie.x, dy = player.y - (susie.y - 5);
    const dist = Math.sqrt(dx * dx + dy * dy);
    if (dist < (player.width/2 + susie.width/2 + 10)) {
        gameState = 'gameover';
        document.getElementById('gameOverScreen').style.display = 'flex';
        document.getElementById('scoreBoard').style.display = 'none';
        document.getElementById('levelBoard').style.display = 'none';
        document.getElementById('joystick').style.display = 'none';
        document.getElementById('touchHint').style.display = 'none';
        document.getElementById('crosshair').style.display = 'none';
        document.getElementById('hintText').style.display = 'none';
        document.getElementById('interactHint').style.display = 'none';
    }
}

function drawFloor() {
    const cfg = levelConfigs[currentLevel];
    ctx.fillStyle = cfg.bgColor; ctx.fillRect(0, 0, canvas.width, canvas.height);
    const tileSize = 60;
    for (let y = 30; y < canvas.height - 30; y += tileSize) {
        for (let x = 30; x < canvas.width - 30; x += tileSize) {
            const isEven = (Math.floor((x-30)/tileSize) + Math.floor((y-30)/tileSize)) % 2 === 0;
            ctx.fillStyle = isEven ? cfg.floorColor1 : cfg.floorColor2; ctx.fillRect(x, y, tileSize, tileSize);
            ctx.strokeStyle = 'rgba(255,255,255,0.03)'; ctx.lineWidth = 1; ctx.strokeRect(x, y, tileSize, tileSize);
        }
    }
}

function drawWalls() {
    const cfg = levelConfigs[currentLevel];
    for (let wall of walls) {
        ctx.fillStyle = cfg.wallColor; ctx.fillRect(wall.x, wall.y, wall.w, wall.h);
        ctx.strokeStyle = 'rgba(255,255,255,0.1)'; ctx.lineWidth = 1; ctx.strokeRect(wall.x, wall.y, wall.w, wall.h);
        if (wall.w > wall.h) { for (let i = wall.x; i < wall.x + wall.w; i += 20) { ctx.strokeStyle = 'rgba(255,255,255,0.05)'; ctx.beginPath(); ctx.moveTo(i, wall.y); ctx.lineTo(i, wall.y + wall.h); ctx.stroke(); } }
    }
}

function drawShelves() {
    const cfg = levelConfigs[currentLevel];
    for (let i = 0; i < shelves.length; i++) {
        let shelf = shelves[i];
        let isFridge = (currentLevel === 1 && i === shelves.length - 2);
        let isTable = (currentLevel === 1 && i === shelves.length - 1);
        if (isFridge) {
            ctx.fillStyle = '#C0C0C0'; ctx.fillRect(shelf.x, shelf.y, shelf.w, shelf.h);
            ctx.strokeStyle = '#A0A0A0'; ctx.lineWidth = 2; ctx.strokeRect(shelf.x, shelf.y, shelf.w, shelf.h);
            ctx.fillStyle = '#87CEEB'; ctx.font = '12px Arial'; ctx.fillText('❄ 冰箱', shelf.x + 5, shelf.y + 20);
        } else if (isTable) {
            ctx.fillStyle = '#8B4513'; ctx.fillRect(shelf.x, shelf.y, shelf.w, shelf.h);
            ctx.strokeStyle = '#654321'; ctx.lineWidth = 2; ctx.strokeRect(shelf.x, shelf.y, shelf.w, shelf.h);
            ctx.fillStyle = '#A0522D'; ctx.fillRect(shelf.x + 2, shelf.y + 2, shelf.w - 4, 8);
        } else {
            ctx.fillStyle = cfg.shelfColor; ctx.fillRect(shelf.x, shelf.y, shelf.w, shelf.h);
            ctx.strokeStyle = '#5a4a3a'; ctx.lineWidth = 2; ctx.strokeRect(shelf.x, shelf.y, shelf.w, shelf.h);
            const layers = 4; const layerH = shelf.h / layers;
            for (let j = 1; j < layers; j++) { ctx.strokeStyle = 'rgba(255,255,255,0.1)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(shelf.x, shelf.y + j * layerH); ctx.lineTo(shelf.x + shelf.w, shelf.y + j * layerH); ctx.stroke(); }
            const colors = ['#8B0000', '#006400', '#00008B', '#8B8B00', '#800080', '#FF6347', '#4169E1', '#32CD32'];
            for (let layer = 0; layer < layers; layer++) { for (let col = 0; col < Math.floor(shelf.w / 16); col++) { ctx.fillStyle = colors[(layer * 3 + col) % colors.length]; ctx.fillRect(shelf.x + 4 + col * 16, shelf.y + layer * layerH + 4, 12, layerH - 8); } }
        }
    }
}

function drawPlayer() {
    ctx.save(); ctx.translate(player.x, player.y);
    ctx.fillStyle = '#4169E1'; ctx.beginPath(); ctx.arc(0, 0, player.width/2, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'white'; ctx.beginPath(); ctx.arc(-6, -4, 5, 0, Math.PI * 2); ctx.arc(6, -4, 5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'black'; ctx.beginPath(); ctx.arc(-6, -4, 2.5, 0, Math.PI * 2); ctx.arc(6, -4, 2.5, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(Math.cos(player.dir) * 15, Math.sin(player.dir) * 15); ctx.stroke();
    ctx.restore();
}

function drawItems() {
    for (let item of items) {
        if (!item.collected) {
            item.angle += 0.03;
            const glow = Math.sin(item.angle * 2) * 6 + 12;
            ctx.save(); ctx.translate(item.x, item.y);
            ctx.shadowColor = '#FFD700'; ctx.shadowBlur = glow;
            ctx.fillStyle = '#D2691E'; ctx.beginPath(); ctx.arc(0, 0, item.size, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#FF6347'; ctx.beginPath(); ctx.arc(-4, -3, 3, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#32CD32'; ctx.beginPath(); ctx.arc(4, -3, 3, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#FFD700'; ctx.font = 'bold 14px Arial'; ctx.textAlign = 'center'; ctx.fillText('🍕', 0, 5);
            ctx.shadowBlur = 0; ctx.restore();
        }
    }
}

function drawInteractables() {
    for (let inter of interactables) {
        if (inter.used) continue;
        if (inter.type === 'toilet') drawToilet(ctx, inter.x, inter.y, inter.w, inter.h);
        else if (inter.type === 'milk') drawMilkBox(ctx, inter.x, inter.y, inter.w, inter.h);
        else if (inter.type === 'drink') drawDrinkCup(ctx, inter.x, inter.y, inter.w, inter.h);
    }
}

function drawParticles() {
    for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx; p.y += p.vy; p.life--;
        p.vx *= 0.98; p.vy *= 0.98;
        if (p.life <= 0) { particles.splice(i, 1); continue; }
        ctx.globalAlpha = p.life / 40;
        ctx.fillStyle = p.color;
        ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (p.life / 40), 0, Math.PI * 2); ctx.fill();
        ctx.globalAlpha = 1;
    }
}

function drawFlashlight() {
    ctx.save();
    ctx.globalCompositeOperation = 'multiply';
    const gradient = ctx.createRadialGradient(player.x, player.y, 30, player.x, player.y, flashlightRadius);
    gradient.addColorStop(0, 'rgba(0,0,0,0)');
    gradient.addColorStop(0.7, 'rgba(0,0,0,0.3)');
    gradient.addColorStop(1, 'rgba(0,0,0,0.92)');
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.globalCompositeOperation = 'source-over';
    ctx.restore();
}

function gameLoop() {
    if (gameState !== 'playing') return;
    frameCount++;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    drawFloor();
    drawWalls();
    drawShelves();
    drawInteractables();
    drawItems();
    drawPlayer();
    drawSusie(ctx, susie.x, susie.y, susie.width, susie.height, susie.animFrame, susie.state === 'chase');
    drawParticles();
    drawFlashlight();
    
    updatePlayer();
    updateSusie();
    checkCollection();
    checkCaught();
    
    const inter = checkInteraction();
    
    if (warningTimer > 0) {
        warningTimer--;
        document.getElementById('warningText').style.display = 'block';
        document.getElementById('warningText').style.opacity = warningTimer / 60;
    } else {
        document.getElementById('warningText').style.display = 'none';
    }
    
    if (frameCount % 300 === 0) {
        const cfg = levelConfigs[currentLevel];
        document.getElementById('hintText').textContent = cfg.hint;
        document.getElementById('hintText').style.display = 'block';
        hintTimer = 180;
    }
    if (hintTimer > 0) {
        hintTimer--;
        if (hintTimer <= 0) document.getElementById('hintText').style.display = 'none';
    }
    
    requestAnimationFrame(gameLoop);
}

// ==================== 事件监听 ====================
window.addEventListener('keydown', (e) => {
    keys[e.key] = true;
    keyCodes[e.keyCode] = true;
    if (e.key === 'e' || e.key === 'E') {
        if (gameState === 'playing') triggerEgg();
    }
});

window.addEventListener('keyup', (e) => {
    keys[e.key] = false;
    keyCodes[e.keyCode] = false;
});

// 触摸/摇杆控制
const joystick = document.getElementById('joystick');
const joystickBase = document.getElementById('joystickBase');
const joystickKnob = document.getElementById('joystickKnob');
let joystickCenterX = 0, joystickCenterY = 0;

joystick.addEventListener('touchstart', (e) => {
    e.preventDefault();
    touchActive = true;
    const rect = joystick.getBoundingClientRect();
    joystickCenterX = rect.left + rect.width / 2;
    joystickCenterY = rect.top + rect.height / 2;
}, {passive: false});

joystick.addEventListener('touchmove', (e) => {
    e.preventDefault();
    if (!touchActive) return;
    const touch = e.touches[0];
    const dx = touch.clientX - joystickCenterX;
    const dy = touch.clientY - joystickCenterY;
    const distance = Math.sqrt(dx * dx + dy * dy);
    const maxDist = 55;
    if (distance > maxDist) {
        const angle = Math.atan2(dy, dx);
        joystickDX = Math.cos(angle);
        joystickDY = Math.sin(angle);
        joystickKnob.style.left = (55 + Math.cos(angle) * maxDist) + 'px';
        joystickKnob.style.top = (55 + Math.sin(angle) * maxDist) + 'px';
    } else {
        joystickDX = dx / maxDist;
        joystickDY = dy / maxDist;
        joystickKnob.style.left = (55 + dx) + 'px';
        joystickKnob.style.top = (55 + dy) + 'px';
    }
}, {passive: false});

joystick.addEventListener('touchend', (e) => {
    e.preventDefault();
    touchActive = false;
    joystickDX = 0; joystickDY = 0;
    joystickKnob.style.left = '55px';
    joystickKnob.style.top = '55px';
});

// ==================== 页面交互函数 ====================
function selectLevel(level) {
    if (level > unlockedLevels) return;
    currentLevel = level;
    initLevel(level);
    gameState = 'playing';
    document.getElementById('levelSelect').style.display = 'none';
    document.getElementById('mainMenu').style.display = 'none';
    document.getElementById('scoreBoard').style.display = 'block';
    document.getElementById('levelBoard').style.display = 'block';
    document.getElementById('joystick').style.display = 'block';
    document.getElementById('touchHint').style.display = 'block';
    document.getElementById('crosshair').style.display = 'block';
    document.getElementById('score').textContent = '0';
    document.getElementById('total').textContent = totalItems;
    document.getElementById('currentLevel').textContent = currentLevel;
    document.getElementById('hintText').textContent = levelConfigs[level].hint;
    document.getElementById('hintText').style.display = 'block';
    hintTimer = 300;
    gameLoop();
}

function goToMenu() {
    gameState = 'menu';
    document.getElementById('mainMenu').style.display = 'flex';
    document.getElementById('levelSelect').style.display = 'none';
    document.getElementById('gameOverScreen').style.display = 'none';
    document.getElementById('victoryScreen').style.display = 'none';
    document.getElementById('eggScreen').style.display = 'none';
    document.getElementById('scoreBoard').style.display = 'none';
    document.getElementById('levelBoard').style.display = 'none';
    document.getElementById('joystick').style.display = 'none';
    document.getElementById('touchHint').style.display = 'none';
    document.getElementById('crosshair').style.display = 'none';
    document.getElementById('hintText').style.display = 'none';
    document.getElementById('interactHint').style.display = 'none';
    document.getElementById('warningText').style.display = 'none';
    
    for (let i = 1; i <= 3; i++) {
        const card = document.getElementById('card' + i);
        if (i <= unlockedLevels) {
            card.classList.remove('locked');
        } else {
            card.classList.add('locked');
        }
        if (eggsFound[i]) {
            document.getElementById('badge' + i).style.display = 'block';
        }
    }
}

function retryLevel() {
    gameState = 'playing';
    document.getElementById('gameOverScreen').style.display = 'none';
    document.getElementById('scoreBoard').style.display = 'block';
    document.getElementById('levelBoard').style.display = 'block';
    document.getElementById('joystick').style.display = 'block';
    document.getElementById('touchHint').style.display = 'block';
    document.getElementById('crosshair').style.display = 'block';
    initLevel(currentLevel);
    gameLoop();
}

// ==================== 按钮事件绑定 ====================
document.getElementById('startBtn').addEventListener('click', () => {
    document.getElementById('mainMenu').style.display = 'none';
    document.getElementById('levelSelect').style.display = 'flex';
    goToMenu();
    document.getElementById('mainMenu').style.display = 'none';
    document.getElementById('levelSelect').style.display = 'flex';
});

document.getElementById('victoryBtn').addEventListener('click', () => {
    document.getElementById('victoryScreen').style.display = 'none';
    if (currentLevel < 3) {
        selectLevel(currentLevel + 1);
    } else {
        goToMenu();
    }
});

document.getElementById('eggBtn').addEventListener('click', () => {
    document.getElementById('eggScreen').style.display = 'none';
    gameState = 'playing';
    document.getElementById('scoreBoard').style.display = 'block';
    document.getElementById('levelBoard').style.display = 'block';
    document.getElementById('joystick').style.display = 'block';
    document.getElementById('touchHint').style.display = 'block';
    document.getElementById('crosshair').style.display = 'block';
    gameLoop();
});

window.addEventListener('resize', () => {
    resizeCanvas();
    if (gameState === 'playing') {
        initLevel(currentLevel);
    }
});

// 初始化
goToMenu();
</script>
