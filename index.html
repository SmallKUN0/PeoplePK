<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>开发者PK作品阅览</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background-color: #000;
            color: #fff;
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            overflow-x: hidden;
        }
        
        h1 {
            font-size: 36px;
            font-weight: bold;
            margin-bottom: 40px;
            text-align: center;
            letter-spacing: 4px;
            text-shadow: 0 0 20px rgba(255,255,255,0.3);
        }
        
        .gallery {
            display: flex;
            flex-direction: row;
            justify-content: center;
            gap: 20px;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }
        
        .gallery img {
            width: 280px;
            height: 180px;
            object-fit: cover;
            border-radius: 8px;
            border: 2px solid #333;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        
        .gallery img:hover {
            border-color: #fff;
            transform: scale(1.03);
            box-shadow: 0 0 20px rgba(255,255,255,0.2);
        }
        
        .controls {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .controls label {
            font-size: 18px;
            color: #ccc;
        }
        
        select {
            width: 320px;
            padding: 12px 16px;
            font-size: 16px;
            background-color: #1a1a1a;
            color: #fff;
            border: 2px solid #444;
            border-radius: 8px;
            cursor: pointer;
            outline: none;
            transition: border-color 0.3s;
        }
        
        select:hover, select:focus {
            border-color: #fff;
        }
        
        select option {
            background-color: #1a1a1a;
            color: #fff;
        }
        
        .btn-read {
            padding: 14px 60px;
            font-size: 18px;
            font-weight: bold;
            background: linear-gradient(135deg, #333, #555);
            color: #fff;
            border: 2px solid #666;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            letter-spacing: 2px;
        }
        
        .btn-read:hover {
            background: linear-gradient(135deg, #444, #777);
            border-color: #fff;
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(255,255,255,0.15);
        }
        
        .btn-read:active {
            transform: translateY(0);
        }
        
        /* 阅览 iframe 容器 */
        .viewer-container {
            width: 100%;
            max-width: 1200px;
            height: 600px;
            border: 2px solid #333;
            border-radius: 12px;
            overflow: hidden;
            display: none;
            margin-top: 20px;
            position: relative;
        }
        
        .viewer-container.active {
            display: block;
        }
        
        .viewer-container iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: #fff;
        }
        
        /* 悬浮球 */
        .float-ball {
            position: fixed;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ff6b6b, #ee5a5a);
            display: none;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(255,107,107,0.4);
            z-index: 9999;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
            transition: box-shadow 0.3s, transform 0.1s;
        }
        
        .float-ball.active {
            display: flex;
        }
        
        .float-ball:hover {
            box-shadow: 0 6px 30px rgba(255,107,107,0.6);
        }
        
        .float-ball.dragging {
            transition: none;
            cursor: grabbing;
        }
        
        .float-ball .icon {
            font-size: 24px;
            color: #fff;
            pointer-events: none;
        }
        
        .float-ball .tooltip {
            position: absolute;
            right: 70px;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0,0,0,0.8);
            color: #fff;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 13px;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }
        
        .float-ball:hover .tooltip {
            opacity: 1;
        }
        
        /* 确认退出弹窗 */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 10000;
        }
        
        .modal-overlay.active {
            display: flex;
        }
        
        .modal-box {
            background: #1a1a1a;
            border: 2px solid #444;
            border-radius: 16px;
            padding: 30px 40px;
            text-align: center;
            max-width: 360px;
            width: 90%;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }
        
        .modal-box h3 {
            font-size: 20px;
            margin-bottom: 12px;
            color: #fff;
        }
        
        .modal-box p {
            font-size: 15px;
            color: #aaa;
            margin-bottom: 24px;
        }
        
        .modal-btns {
            display: flex;
            gap: 16px;
            justify-content: center;
        }
        
        .modal-btns button {
            padding: 10px 28px;
            font-size: 15px;
            border-radius: 8px;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
        }
        
        .btn-confirm {
            background: #ff6b6b;
            color: #fff;
        }
        
        .btn-confirm:hover {
            background: #ff5252;
        }
        
        .btn-cancel {
            background: #333;
            color: #fff;
            border: 1px solid #555 !important;
        }
        
        .btn-cancel:hover {
            background: #444;
        }
        
        .current-file {
            margin-top: 10px;
            font-size: 14px;
            color: #888;
        }
    </style>
</head>
<body>
    <h1>开发者PK作品阅览</h1>
    
    <div class="gallery">
        <img src="1.jpg" alt="预览图1" onerror="this.style.display='none'">
        <img src="2.jpg" alt="预览图2" onerror="this.style.display='none'">
        <img src="3.jpg" alt="预览图3" onerror="this.style.display='none'">
    </div>
    
    <div class="controls">
        <label for="fileSelect">选择要阅览的作品：</label>
        <select id="fileSelect">
            <option value="" disabled selected>请选择作品文件</option>
            <option value="AppleOffice_1.html">AppleOffice_1</option>
            <option value="AppleOffice_2.html">AppleOffice_2</option>
            <option value="iubspqf_1.html">iubspqf_1</option>
            <option value="iubspqf_2.html">iubspqf_2</option>
            <option value="zhezhe_1.html">哲哲工作室_1</option>
            <option value="zhezhe_2.html">哲哲工作室_2</option>
        </select>
        <button class="btn-read" id="btnRead">阅览</button>
        <div class="current-file" id="currentFile"></div>
    </div>
    
    <div class="viewer-container" id="viewerContainer">
        <iframe id="viewerFrame" src=""></iframe>
    </div>
    
    <!-- 悬浮球 -->
    <div class="float-ball" id="floatBall">
        <span class="icon">✕</span>
        <span class="tooltip">点击退出 / 长按拖动</span>
    </div>
    
    <!-- 确认退出弹窗 -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-box">
            <h3>确认退出阅览？</h3>
            <p>退出后将返回作品选择页面</p>
            <div class="modal-btns">
                <button class="btn-confirm" id="btnConfirmExit">确认退出</button>
                <button class="btn-cancel" id="btnCancelExit">取消</button>
            </div>
        </div>
    </div>
    
    <script>
        const fileSelect = document.getElementById('fileSelect');
        const btnRead = document.getElementById('btnRead');
        const viewerContainer = document.getElementById('viewerContainer');
        const viewerFrame = document.getElementById('viewerFrame');
        const floatBall = document.getElementById('floatBall');
        const modalOverlay = document.getElementById('modalOverlay');
        const btnConfirmExit = document.getElementById('btnConfirmExit');
        const btnCancelExit = document.getElementById('btnCancelExit');
        const currentFile = document.getElementById('currentFile');
        
        // 阅览按钮点击
        btnRead.addEventListener('click', function() {
            const selected = fileSelect.value;
            if (!selected) {
                alert('请先选择一个作品文件！');
                return;
            }
            
            // 显示 iframe 并加载对应文件
            viewerFrame.src = selected;
            viewerContainer.classList.add('active');
            floatBall.classList.add('active');
            
            // 显示当前文件名
            const displayName = fileSelect.options[fileSelect.selectedIndex].text;
            currentFile.textContent = '当前阅览：' + displayName;
            
            // 滚动到阅览区域
            viewerContainer.scrollIntoView({ behavior: 'smooth' });
        });
        
        // 悬浮球交互
        let pressStartTime = 0;
        let isDragging = false;
        let dragStartX = 0;
        let dragStartY = 0;
        let ballStartX = 0;
        let ballStartY = 0;
        let dragThreshold = 5; // 移动超过5px视为拖动
        let hasMoved = false;
        
        function getPointerPos(e) {
            if (e.touches && e.touches.length > 0) {
                return { x: e.touches[0].clientX, y: e.touches[0].clientY };
            }
            return { x: e.clientX, y: e.clientY };
        }
        
        function onPointerDown(e) {
            pressStartTime = Date.now();
            isDragging = false;
            hasMoved = false;
            const pos = getPointerPos(e);
            dragStartX = pos.x;
            dragStartY = pos.y;
            const rect = floatBall.getBoundingClientRect();
            ballStartX = rect.left;
            ballStartY = rect.top;
            
            // 300ms 后如果还在按住，则进入拖动模式
            setTimeout(() => {
                if (pressStartTime > 0 && !hasMoved && Date.now() - pressStartTime >= 300) {
                    isDragging = true;
                    floatBall.classList.add('dragging');
                }
            }, 300);
        }
        
        function onPointerMove(e) {
            if (pressStartTime === 0) return;
            const pos = getPointerPos(e);
            const dx = pos.x - dragStartX;
            const dy = pos.y - dragStartY;
            
            if (Math.abs(dx) > dragThreshold || Math.abs(dy) > dragThreshold) {
                hasMoved = true;
            }
            
            if (isDragging) {
                e.preventDefault();
                floatBall.style.left = (ballStartX + dx) + 'px';
                floatBall.style.top = (ballStartY + dy) + 'px';
                floatBall.style.right = 'auto';
                floatBall.style.transform = 'none';
            }
        }
        
        function onPointerUp(e) {
            const pressDuration = Date.now() - pressStartTime;
            pressStartTime = 0;
            floatBall.classList.remove('dragging');
            
            if (isDragging) {
                isDragging = false;
                return;
            }
            
            // 点击不超过0.3秒且没有明显移动，弹出确认退出
            if (pressDuration < 300 && !hasMoved) {
                modalOverlay.classList.add('active');
            }
        }
        
        // 鼠标事件
        floatBall.addEventListener('mousedown', onPointerDown);
        document.addEventListener('mousemove', onPointerMove);
        document.addEventListener('mouseup', onPointerUp);
        
        // 触摸事件
        floatBall.addEventListener('touchstart', onPointerDown, { passive: false });
        document.addEventListener('touchmove', onPointerMove, { passive: false });
        document.addEventListener('touchend', onPointerUp);
        
        // 确认退出
        btnConfirmExit.addEventListener('click', function() {
            viewerFrame.src = '';
            viewerContainer.classList.remove('active');
            floatBall.classList.remove('active');
            modalOverlay.classList.remove('active');
            currentFile.textContent = '';
            
            // 重置悬浮球位置
            floatBall.style.left = '';
            floatBall.style.top = '';
            floatBall.style.right = '20px';
            floatBall.style.transform = 'translateY(-50%)';
        });
        
        // 取消退出
        btnCancelExit.addEventListener('click', function() {
            modalOverlay.classList.remove('active');
        });
        
        // 点击遮罩关闭弹窗
        modalOverlay.addEventListener('click', function(e) {
            if (e.target === modalOverlay) {
                modalOverlay.classList.remove('active');
            }
        });
    </script>
</body>
</html>
