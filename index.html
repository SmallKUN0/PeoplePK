
html_content = '''<!DOCTYPE html>

<head>

    <style>

            background-clip: text;
        }
        .gallery {
            display: flex;

            border-color: #666;
            transform: scale(1.05);
        }
        .gallery-item img {
            width: 100%;

            display: block;
        }
        .controls {
            display: flex;

        .viewer-placeholder.hidden {
            display: none;

        /* 悬浮球 */
        .float-ball {

        .modal-overlay {

        .modal-overlay.active {
            display: flex;

        .modal-box {
            background: #1a1a2e;
            border: 1px solid #333;
            border-radius: 16px;
            padding: 30px 40px;
            text-align: center;
            max-width: 360px;
            width: 90%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }
        .modal-box h3 {
            font-size: 20px;
            margin-bottom: 12px;
            color: #fff;
        }
        .modal-box p {
            color: #aaa;
            margin-bottom: 24px;
            font-size: 14px;
        }
        .modal-btns {
            display: flex;
            gap: 12px;
            justify-content: center;
        }
        .modal-btn {
            padding: 10px 28px;
            border-radius: 8px;
            border: none;
            font-size: 14px;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .modal-btn:hover {
            opacity: 0.85;
        }
        .modal-btn.confirm {
            background: #e74c3c;

        }
        .modal-btn.cancel {
            background: #333;

        /* 图片标签 */
        .gallery-labels {
            display: flex;
            gap: 20px;

            flex-wrap: wrap;
            justify-content: center;
        }
        .gallery-label {
            width: 200px;
            text-align: center;

        }
    </style>
</head>
<body>
    <h1>开发者PK作品阅览</h1>

    <div class="gallery">
        <div class="gallery-item"><img src="1.jpg" alt="哲哲工作室"></div>

        <div class="gallery-item"><img src="3.jpg" alt="AppleOffice"></div>
    </div>

    <div class="gallery-labels">
        <div class="gallery-label">哲哲工作室</div>
        <div class="gallery-label">iubspqf</div>
        <div class="gallery-label">AppleOffice</div>
    </div>

    <div class="controls">
        <select class="file-select" id="fileSelect">
            <option value="" disabled selected>请选择要阅览的作品</option>
            <option value="AppleOffice_1.html">AppleOffice_1.html</option>
            <option value="AppleOffice_2.html">AppleOffice_2.html</option>
            <option value="iubspqf_1.html">iubspqf_1.html</option>
            <option value="iubspqf_2.html">iubspqf_2.html</option>
            <option value="zhezhe_1.html">zhezhe_1.html（哲哲工作室）</option>
            <option value="zhezhe_2.html">zhezhe_2.html（哲哲工作室）</option>
        </select>
        <button class="read-btn" id="readBtn">阅览</button>
    </div>

    <div class="viewer-placeholder" id="placeholder">
        <span>请选择作品并点击"阅览"按钮</span>
    </div>
    <div class="viewer-container" id="viewer">
        <iframe id="viewerFrame" src=""></iframe>
    </div>

    <!-- 悬浮球 -->
    <div class="float-ball" id="floatBall">
        <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
    </div>

    <!-- 确认退出弹窗 -->
    <div class="modal-overlay" id="modal">
        <div class="modal-box">
            <h3>确认退出阅览？</h3>
            <p>退出后将返回作品选择界面</p>
            <div class="modal-btns">
                <button class="modal-btn confirm" id="confirmExit">确认退出</button>
                <button class="modal-btn cancel" id="cancelExit">取消</button>
            </div>
        </div>
    </div>

    <script>
        const fileSelect = document.getElementById('fileSelect');
        const readBtn = document.getElementById('readBtn');
        const viewer = document.getElementById('viewer');
        const placeholder = document.getElementById('placeholder');
        const viewerFrame = document.getElementById('viewerFrame');
        const floatBall = document.getElementById('floatBall');
        const modal = document.getElementById('modal');
        const confirmExit = document.getElementById('confirmExit');
        const cancelExit = document.getElementById('cancelExit');

        // 阅览按钮
        readBtn.addEventListener('click', () => {
            const file = fileSelect.value;
            if (!file) {
                alert('请先选择一个作品！');
                return;
            }
            viewerFrame.src = file;
            placeholder.classList.add('hidden');
            viewer.classList.add('active');
            floatBall.classList.add('active');
        });

        // 退出阅览
        function exitViewer() {
            viewerFrame.src = '';
            viewer.classList.remove('active');
            placeholder.classList.remove('hidden');
            floatBall.classList.remove('active');
            modal.classList.remove('active');
            // 重置悬浮球位置
            floatBall.style.top = '50%';
            floatBall.style.right = '20px';
            floatBall.style.left = '';
            floatBall.style.transform = 'translateY(-50%)';
        }

        confirmExit.addEventListener('click', exitViewer);
        cancelExit.addEventListener('click', () => {
            modal.classList.remove('active');
        });
        modal.addEventListener('click', (e) => {
            if (e.target === modal) modal.classList.remove('active');
        });

        // 悬浮球交互：短按弹出退出确认，长按拖动
        let pressTimer = null;
        let pressStartTime = 0;
        let isDragging = false;
        let dragStartX = 0;
        let dragStartY = 0;
        let ballStartX = 0;
        let ballStartY = 0;
        const LONG_PRESS_THRESHOLD = 300; // 0.3秒

        floatBall.addEventListener('mousedown', onPointerDown);
        floatBall.addEventListener('touchstart', onPointerDown, { passive: false });

        function onPointerDown(e) {
            if (!floatBall.classList.contains('active')) return;
            
            isDragging = false;
            pressStartTime = Date.now();
            
            const clientX = e.type.includes('touch') ? e.touches[0].clientX : e.clientX;
            const clientY = e.type.includes('touch') ? e.touches[0].clientY : e.clientY;
            
            dragStartX = clientX;
            dragStartY = clientY;
            
            const rect = floatBall.getBoundingClientRect();
            ballStartX = rect.left;
            ballStartY = rect.top;

            pressTimer = setTimeout(() => {
                // 超过0.3秒，进入拖动模式
                isDragging = true;
                floatBall.classList.add('dragging');
                floatBall.style.transition = 'none';
                floatBall.style.transform = 'none';
            }, LONG_PRESS_THRESHOLD);
        }

        function onPointerMove(e) {
            if (!floatBall.classList.contains('active')) return;
            if (!isDragging) {
                // 还没进入拖动模式，但移动了，取消计时器
                const clientX = e.type.includes('touch') ? e.touches[0].clientX : e.clientX;
                const clientY = e.type.includes('touch') ? e.touches[0].clientY : e.clientY;
                const dx = clientX - dragStartX;
                const dy = clientY - dragStartY;
                if (Math.abs(dx) > 5 || Math.abs(dy) > 5) {
                    clearTimeout(pressTimer);
                    pressTimer = null;
                }
                return;
            }
            e.preventDefault();
            const clientX = e.type.includes('touch') ? e.touches[0].clientX : e.clientX;
            const clientY = e.type.includes('touch') ? e.touches[0].clientY : e.clientY;
            
            const newLeft = ballStartX + (clientX - dragStartX);
            const newTop = ballStartY + (clientY - dragStartY);
            
            floatBall.style.left = newLeft + 'px';
            floatBall.style.top = newTop + 'px';
            floatBall.style.right = 'auto';
        }

        function onPointerUp(e) {
            if (!floatBall.classList.contains('active')) return;
            
            const pressDuration = Date.now() - pressStartTime;
            
            clearTimeout(pressTimer);
            pressTimer = null;
            
            if (isDragging) {
                // 结束拖动
                isDragging = false;
                floatBall.classList.remove('dragging');
                floatBall.style.transition = 'box-shadow 0.3s';
            } else if (pressDuration < LONG_PRESS_THRESHOLD) {
                // 短按，弹出确认退出
                modal.classList.add('active');
            }
        }

        document.addEventListener('mousemove', onPointerMove);
        document.addEventListener('touchmove', onPointerMove, { passive: false });
        document.addEventListener('mouseup', onPointerUp);
        document.addEventListener('touchend', onPointerUp);
    </script>
</body>
</html>'''
