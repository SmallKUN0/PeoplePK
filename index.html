<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>开发者PK作品阅览</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000;
            color: #fff;
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }

        h1 {
            font-size: 32px;
            margin-bottom: 40px;
            letter-spacing: 4px;
            text-shadow: 0 0 20px rgba(255,255,255,0.3);
        }

        .gallery {
            display: flex;
            gap: 20px;
            margin-bottom: 40px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .gallery-item {
            width: 200px;
            height: 200px;
            border: 2px solid #333;
            border-radius: 8px;
            overflow: hidden;
            transition: border-color 0.3s, transform 0.3s;
        }

        .gallery-item:hover {
            border-color: #666;
            transform: scale(1.02);
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .selector-section {
            margin-bottom: 30px;
            text-align: center;
        }

        .selector-section label {
            display: block;
            margin-bottom: 15px;
            font-size: 18px;
            color: #ccc;
        }

        select {
            padding: 12px 24px;
            font-size: 16px;
            border: 2px solid #444;
            border-radius: 8px;
            background-color: #111;
            color: #fff;
            cursor: pointer;
            min-width: 280px;
            outline: none;
            transition: border-color 0.3s;
        }

        select:hover, select:focus {
            border-color: #888;
        }

        option {
            background-color: #111;
            color: #fff;
            padding: 8px;
        }

        .btn-read {
            padding: 14px 50px;
            font-size: 18px;
            border: 2px solid #fff;
            border-radius: 8px;
            background-color: transparent;
            color: #fff;
            cursor: pointer;
            letter-spacing: 4px;
            transition: all 0.3s;
        }

        .btn-read:hover {
            background-color: #fff;
            color: #000;
        }

        /* 悬浮球 */
        .float-ball {
            position: fixed;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            box-shadow: 0 4px 20px rgba(102, 126, 234, 0.5);
            cursor: grab;
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            user-select: none;
            -webkit-user-select: none;
            transition: box-shadow 0.3s;
        }

        .float-ball:active {
            cursor: grabbing;
            box-shadow: 0 6px 30px rgba(102, 126, 234, 0.7);
        }

        .float-ball::after {
            content: '✕';
            color: #fff;
            font-size: 22px;
            font-weight: bold;
        }

        /* 确认退出弹窗 */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 10000;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-box {
            background-color: #1a1a1a;
            border: 1px solid #444;
            border-radius: 12px;
            padding: 30px 40px;
            text-align: center;
            min-width: 300px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }

        .modal-box p {
            font-size: 18px;
            margin-bottom: 25px;
            color: #eee;
        }

        .modal-btns {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        .modal-btns button {
            padding: 10px 30px;
            font-size: 15px;
            border-radius: 6px;
            cursor: pointer;
            border: 1px solid;
            transition: all 0.2s;
        }

        .btn-confirm {
            background-color: #e74c3c;
            border-color: #e74c3c;
            color: #fff;
        }

        .btn-confirm:hover {
            background-color: #c0392b;
        }

        .btn-cancel {
            background-color: transparent;
            border-color: #666;
            color: #ccc;
        }

        .btn-cancel:hover {
            border-color: #999;
            color: #fff;
        }
    </style>
</head>
<body>
    <h1>开发者PK作品阅览</h1>

    <div class="gallery">
        <div class="gallery-item">
            <img src="1.jpg" alt="预览图1" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22200%22 height=%22200%22><rect width=%22200%22 height=%22200%22 fill=%22%23222%22/><text x=%22100%22 y=%22110%22 fill=%22%23666%22 font-size=%2220%22 text-anchor=%22middle%22>1.jpg</text></svg>'">
        </div>
        <div class="gallery-item">
            <img src="2.jpg" alt="预览图2" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22200%22 height=%22200%22><rect width=%22200%22 height=%22200%22 fill=%22%23222%22/><text x=%22100%22 y=%22110%22 fill=%22%23666%22 font-size=%2220%22 text-anchor=%22middle%22>2.jpg</text></svg>'">
        </div>
        <div class="gallery-item">
            <img src="3.jpg" alt="预览图3" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%22200%22 height=%22200%22><rect width=%22200%22 height=%22200%22 fill=%22%23222%22/><text x=%22100%22 y=%22110%22 fill=%22%23666%22 font-size=%2220%22 text-anchor=%22middle%22>3.jpg</text></svg>'">
        </div>
    </div>

    <div class="selector-section">
        <label for="workSelect">选择要阅览的作品</label>
        <select id="workSelect">
            <option value="" disabled selected>-- 请选择作品 --</option>
            <option value="AppleOffice_1.html">AppleOffice_1.html</option>
            <option value="AppleOffice_2.html">AppleOffice_2.html</option>
            <option value="iubspqf_1.html">iubspqf_1.html</option>
            <option value="iubspqf_2.html">iubspqf_2.html</option>
            <option value="zhezhe_1.html">哲哲工作室 - zhezhe_1.html</option>
            <option value="zhezhe_2.html">哲哲工作室 - zhezhe_2.html</option>
        </select>
    </div>

    <button class="btn-read" id="btnRead">阅览</button>

    <!-- 悬浮球 -->
    <div class="float-ball" id="floatBall"></div>

    <!-- 确认退出弹窗 -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-box">
            <p>确认要退出阅览吗？</p>
            <div class="modal-btns">
                <button class="btn-confirm" id="btnConfirm">确认</button>
                <button class="btn-cancel" id="btnCancel">取消</button>
            </div>
        </div>
    </div>

    <script>
        const workSelect = document.getElementById('workSelect');
        const btnRead = document.getElementById('btnRead');
        const floatBall = document.getElementById('floatBall');
        const modalOverlay = document.getElementById('modalOverlay');
        const btnConfirm = document.getElementById('btnConfirm');
        const btnCancel = document.getElementById('btnCancel');

        // 阅览按钮点击
        btnRead.addEventListener('click', function() {
            const selected = workSelect.value;
            if (!selected) {
                alert('请先选择一个作品！');
                return;
            }
            // 在新窗口/标签页打开对应文件
            window.open(selected, '_blank');
            // 显示悬浮球
            floatBall.style.display = 'flex';
        });

        // 悬浮球交互
        let pressStartTime = 0;
        let isDragging = false;
        let dragStartX = 0;
        let dragStartY = 0;
        let ballStartX = 0;
        let ballStartY = 0;
        let hasMoved = false;

        floatBall.addEventListener('mousedown', function(e) {
            pressStartTime = Date.now();
            isDragging = false;
            hasMoved = false;
            dragStartX = e.clientX;
            dragStartY = e.clientY;
            ballStartX = floatBall.offsetLeft;
            ballStartY = floatBall.offsetTop;
        });

        document.addEventListener('mousemove', function(e) {
            if (pressStartTime === 0) return;
            const dx = e.clientX - dragStartX;
            const dy = e.clientY - dragStartY;
            if (Math.abs(dx) > 3 || Math.abs(dy) > 3) {
                isDragging = true;
                hasMoved = true;
                floatBall.style.left = (ballStartX + dx) + 'px';
                floatBall.style.top = (ballStartY + dy) + 'px';
                floatBall.style.right = 'auto';
                floatBall.style.transform = 'none';
            }
        });

        document.addEventListener('mouseup', function(e) {
            if (pressStartTime === 0) return;
            const pressDuration = Date.now() - pressStartTime;
            pressStartTime = 0;

            if (!hasMoved && pressDuration <= 300) {
                // 点击不超过0.3秒，弹出确认退出
                modalOverlay.classList.add('active');
            }
            isDragging = false;
        });

        // 触摸支持（移动端）
        floatBall.addEventListener('touchstart', function(e) {
            pressStartTime = Date.now();
            isDragging = false;
            hasMoved = false;
            const touch = e.touches[0];
            dragStartX = touch.clientX;
            dragStartY = touch.clientY;
            ballStartX = floatBall.offsetLeft;
            ballStartY = floatBall.offsetTop;
            e.preventDefault();
        }, { passive: false });

        document.addEventListener('touchmove', function(e) {
            if (pressStartTime === 0) return;
            const touch = e.touches[0];
            const dx = touch.clientX - dragStartX;
            const dy = touch.clientY - dragStartY;
            if (Math.abs(dx) > 3 || Math.abs(dy) > 3) {
                isDragging = true;
                hasMoved = true;
                floatBall.style.left = (ballStartX + dx) + 'px';
                floatBall.style.top = (ballStartY + dy) + 'px';
                floatBall.style.right = 'auto';
                floatBall.style.transform = 'none';
            }
        }, { passive: false });

        document.addEventListener('touchend', function(e) {
            if (pressStartTime === 0) return;
            const pressDuration = Date.now() - pressStartTime;
            pressStartTime = 0;

            if (!hasMoved && pressDuration <= 300) {
                modalOverlay.classList.add('active');
            }
            isDragging = false;
        });

        // 弹窗按钮
        btnConfirm.addEventListener('click', function() {
            modalOverlay.classList.remove('active');
            floatBall.style.display = 'none';
            // 重置悬浮球位置
            floatBall.style.left = '';
            floatBall.style.top = '';
            floatBall.style.right = '20px';
            floatBall.style.transform = 'translateY(-50%)';
        });

        btnCancel.addEventListener('click', function() {
            modalOverlay.classList.remove('active');
        });

        // 点击遮罩关闭弹窗
        modalOverlay.addEventListener('click', function(e) {
            if (e.target === modalOverlay) {
                modalOverlay.classList.remove('active');
            }
        });
    </script>
</body>
</html>
