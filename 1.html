<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>王国战争</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a0f;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 40px 20px;
      font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
      position: relative;
      overflow-x: hidden;
      color: #e8f0ff;
    }
    .bg-glow-1 {
      position: fixed; top: 10%; left: 10%;
      width: 300px; height: 300px;
      background: radial-gradient(circle, rgba(30,60,120,0.15), transparent 70%);
      border-radius: 50%; pointer-events: none; z-index: 0;
    }
    .bg-glow-2 {
      position: fixed; bottom: 20%; right: 15%;
      width: 250px; height: 250px;
      background: radial-gradient(circle, rgba(60,100,180,0.1), transparent 70%);
      border-radius: 50%; pointer-events: none; z-index: 0;
    }
    h1 {
      color: #e8f0ff; font-size: 48px; font-weight: 800;
      letter-spacing: 8px;
      text-shadow: 0 0 30px rgba(80,140,255,0.4), 0 0 60px rgba(40,80,160,0.2);
      margin-bottom: 12px; z-index: 1;
    }
    .author {
      color: #8aa4d0; font-size: 16px; letter-spacing: 2px;
      margin-bottom: 40px; z-index: 1;
    }
    .chart-wrap {
      position: relative; width: 360px; height: 360px;
      margin-bottom: 30px; z-index: 1;
    }
    #hexCanvas { display: block; }
    .score-center {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      text-align: center; pointer-events: none;
    }
    .score-center .label {
      color: #4fc3f7; font-size: 14px; letter-spacing: 2px; margin-bottom: 4px;
    }
    .score-center .grade {
      color: #fff; font-size: 42px; font-weight: 900;
      text-shadow: 0 0 20px rgba(79,195,247,0.6);
    }
    .stats-grid {
      display: grid; grid-template-columns: repeat(3, 1fr);
      gap: 12px 24px; margin-bottom: 40px; z-index: 1;
      max-width: 400px; width: 100%;
    }
    .stat-item { text-align: center; }
    .stat-item .val { color: #4fc3f7; font-size: 20px; font-weight: 700; }
    .stat-item .name { color: #6a8ab8; font-size: 12px; margin-top: 2px; }
    #readBtn {
      z-index: 1;
      background: linear-gradient(135deg, #1a3a6c, #0d1f3d);
      color: #c8ddff; border: 1px solid #2a5a9e;
      padding: 14px 48px; font-size: 18px; letter-spacing: 4px;
      border-radius: 8px; cursor: pointer;
      box-shadow: 0 0 20px rgba(42,90,158,0.3);
      transition: all 0.3s; position: relative; overflow: hidden;
    }
    #readBtn:hover {
      box-shadow: 0 0 30px rgba(42,90,158,0.6);
      transform: translateY(-2px);
    }
    #floatBall {
      display: none; position: fixed; bottom: 40px; right: 40px;
      width: 56px; height: 56px;
      background: linear-gradient(135deg, #1e3a5f, #0d1f3d);
      border: 2px solid #3a7bd5; border-radius: 50%;
      color: #c8ddff; font-size: 13px;
      align-items: center; justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5), 0 0 15px rgba(58,123,213,0.3);
      z-index: 1000; user-select: none; touch-action: none;
      transition: transform 0.1s;
    }
    #confirmModal {
      display: none; position: fixed; top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.7); z-index: 2000;
      align-items: center; justify-content: center;
    }
    .modal-box {
      background: #0f1620; border: 1px solid #2a5a9e;
      border-radius: 12px; padding: 32px 40px;
      text-align: center;
      box-shadow: 0 0 40px rgba(42,90,158,0.3);
      max-width: 320px;
    }
    .modal-box p { color: #e8f0ff; font-size: 18px; margin-bottom: 24px; }
    .modal-box button {
      padding: 10px 28px; border-radius: 6px;
      cursor: pointer; font-size: 14px; transition: all 0.2s;
    }
    .btn-exit {
      background: #1a3a6c; color: #c8ddff; border: 1px solid #3a7bd5;
    }
    .btn-exit:hover { background: #244a80; }
    .btn-cancel {
      background: transparent; color: #8aa4d0; border: 1px solid #3a4a5e;
    }
    .btn-cancel:hover { border-color: #5a7a9e; color: #b0c8e8; }
  </style>
</head>
<body>
  <div class="bg-glow-1"></div>
  <div class="bg-glow-2"></div>

  <h1>王国战争</h1>
  <p class="author">作者：Baby（王国战争）</p>

  <div class="chart-wrap">
    <canvas id="hexCanvas" width="360" height="360"></canvas>
    <div class="score-center">
      <div class="label">综合评分</div>
      <div class="grade">SSS+</div>
    </div>
  </div>

  <div class="stats-grid">
    <div class="stat-item"><div class="val">98</div><div class="name">创意</div></div>
    <div class="stat-item"><div class="val">100</div><div class="name">态度</div></div>
    <div class="stat-item"><div class="val">95</div><div class="name">开发技术</div></div>
    <div class="stat-item"><div class="val">89</div><div class="name">视觉</div></div>
    <div class="stat-item"><div class="val">90</div><div class="name">丰富程度</div></div>
    <div class="stat-item"><div class="val">99</div><div class="name">综合</div></div>
  </div>

  <button id="readBtn">点击阅览</button>

  <div id="floatBall">退出</div>

  <div id="confirmModal">
    <div class="modal-box">
      <p>确认退出阅览？</p>
      <div style="display:flex;gap:16px;justify-content:center;">
        <button class="btn-exit" id="confirmExit">退出</button>
        <button class="btn-cancel" id="cancelExit">取消</button>
      </div>
    </div>
  </div>

  <script>
    (function(){
      // 绘制六边形雷达图
      const canvas = document.getElementById('hexCanvas');
      const ctx = canvas.getContext('2d');
      const cx = 180, cy = 180, r = 120;
      const attrs = [
        {name:'创意',value:98},
        {name:'态度',value:100},
        {name:'开发技术',value:95},
        {name:'视觉',value:89},
        {name:'丰富程度',value:90},
        {name:'综合',value:99}
      ];
      const count = 6;

      function drawHex(){
        ctx.clearRect(0,0,360,360);
        // 背景网格
        for(let level=1;level<=5;level++){
          ctx.beginPath();
          for(let i=0;i<count;i++){
            const angle = Math.PI/2 + (Math.PI*2*i)/count;
            const lr = (r/5)*level;
            const x = cx + lr*Math.cos(angle);
            const y = cy + lr*Math.sin(angle);
            if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
          }
          ctx.closePath();
          ctx.strokeStyle = level===5 ? '#3a7bd5' : 'rgba(58,123,213,0.2)';
          ctx.lineWidth = level===5 ? 1.5 : 0.8;
          ctx.stroke();
        }
        // 轴线
        for(let i=0;i<count;i++){
          const angle = Math.PI/2 + (Math.PI*2*i)/count;
          ctx.beginPath();
          ctx.moveTo(cx,cy);
          ctx.lineTo(cx+r*Math.cos(angle),cy+r*Math.sin(angle));
          ctx.strokeStyle = 'rgba(58,123,213,0.25)';
          ctx.lineWidth = 0.8;
          ctx.stroke();
        }
        // 数据区域
        ctx.beginPath();
        for(let i=0;i<count;i++){
          const angle = Math.PI/2 + (Math.PI*2*i)/count;
          const vr = (attrs[i].value/100)*r;
          const x = cx + vr*Math.cos(angle);
          const y = cy + vr*Math.sin(angle);
          if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
        }
        ctx.closePath();
        ctx.fillStyle = 'rgba(79,195,247,0.15)';
        ctx.fill();
        ctx.strokeStyle = '#4fc3f7';
        ctx.lineWidth = 2;
        ctx.stroke();
        // 数据点 + 标签
        for(let i=0;i<count;i++){
          const angle = Math.PI/2 + (Math.PI*2*i)/count;
          const vr = (attrs[i].value/100)*r;
          const x = cx + vr*Math.cos(angle);
          const y = cy + vr*Math.sin(angle);
          ctx.beginPath();
          ctx.arc(x,y,4,0,Math.PI*2);
          ctx.fillStyle = '#4fc3f7';
          ctx.fill();
          ctx.strokeStyle = '#fff';
          ctx.lineWidth = 1.5;
          ctx.stroke();
          const lx = cx + (r+22)*Math.cos(angle);
          const ly = cy + (r+22)*Math.sin(angle);
          ctx.fillStyle = '#8aa4d0';
          ctx.font = '12px sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(attrs[i].name,lx,ly);
        }
      }
      drawHex();

      // 点击阅览 -> 驱动同目录 Html/1.html
      const readBtn = document.getElementById('readBtn');
      const floatBall = document.getElementById('floatBall');
      const confirmModal = document.getElementById('confirmModal');
      const confirmExit = document.getElementById('confirmExit');
      const cancelExit = document.getElementById('cancelExit');

      readBtn.addEventListener('click', function(){
        window.location.href = './Html/1.html';
        floatBall.style.display = 'flex';
      });

      // 悬浮球：拖动 + 短按(≤0.4s)弹窗 / 长按(>0.4s)不弹窗
      let isDragging = false, dragStart = false;
      let pressStartTime = 0;
      let startX = 0, startY = 0, ballLeft = 0, ballTop = 0;

      function onPointerDown(e){
        dragStart = true; isDragging = false;
        pressStartTime = Date.now();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        startX = clientX; startY = clientY;
        ballLeft = floatBall.offsetLeft;
        ballTop = floatBall.offsetTop;
        floatBall.style.transition = 'none';
      }
      function onPointerMove(e){
        if(!dragStart) return;
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        const dx = clientX - startX;
        const dy = clientY - startY;
        if(Math.abs(dx)>3 || Math.abs(dy)>3) isDragging = true;
        if(isDragging){
          floatBall.style.left = (ballLeft + dx) + 'px';
          floatBall.style.top = (ballTop + dy) + 'px';
          floatBall.style.bottom = 'auto';
          floatBall.style.right = 'auto';
        }
      }
      function onPointerUp(e){
        if(!dragStart) return;
        dragStart = false;
        floatBall.style.transition = 'transform 0.1s';
        const pressDuration = Date.now() - pressStartTime;
        if(!isDragging && pressDuration <= 400){
          confirmModal.style.display = 'flex';
        }
        isDragging = false;
      }

      floatBall.addEventListener('mousedown', onPointerDown);
      document.addEventListener('mousemove', onPointerMove);
      document.addEventListener('mouseup', onPointerUp);
      floatBall.addEventListener('touchstart', onPointerDown, {passive:false});
      document.addEventListener('touchmove', onPointerMove, {passive:false});
      document.addEventListener('touchend', onPointerUp);

      // 弹窗交互
      confirmExit.addEventListener('click', function(){
        confirmModal.style.display = 'none';
        floatBall.style.display = 'none';
        if(window.history.length > 1) window.history.back();
        else window.location.href = 'about:blank';
      });
      cancelExit.addEventListener('click', function(){
        confirmModal.style.display = 'none';
      });
      confirmModal.addEventListener('click', function(e){
        if(e.target === confirmModal) confirmModal.style.display = 'none';
      });
    })();
  </script>
</body>
</html>
