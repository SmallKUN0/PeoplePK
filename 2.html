<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web GL流体模拟</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a0f;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 40px 20px;
      font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
      position: relative;
      overflow-x: hidden;
      color: #e8f0ff;
    }
    .bg-glow-1 {
      position: fixed; top: 10%; left: 10%;
      width: 300px; height: 300px;
      background: radial-gradient(circle, rgba(30,60,120,0.15), transparent 70%);
      border-radius: 50%; pointer-events: none; z-index: 0;
    }
    .bg-glow-2 {
      position: fixed; bottom: 20%; right: 15%;
      width: 250px; height: 250px;
      background: radial-gradient(circle, rgba(60,100,180,0.1), transparent 70%);
      border-radius: 50%; pointer-events: none; z-index: 0;
    }
    .tag-bar {
      position: fixed;
      top: 20px;
      left: 20px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      z-index: 100;
      max-width: 90vw;
    }
    .tag-bar span {
      background: rgba(13, 31, 61, 0.85);
      border: 1px solid #2a5a9e;
      color: #8aa4d0;
      font-size: 12px;
      padding: 5px 12px;
      border-radius: 20px;
      letter-spacing: 1px;
      backdrop-filter: blur(4px);
      transition: all 0.25s;
      white-space: nowrap;
    }
    .tag-bar span:hover {
      background: rgba(26, 58, 108, 0.9);
      border-color: #4fc3f7;
      color: #c8ddff;
      box-shadow: 0 0 12px rgba(79, 195, 247, 0.25);
      transform: translateY(-1px);
    }
    h1 {
      color: #e8f0ff; font-size: 48px; font-weight: 800;
      letter-spacing: 8px;
      text-shadow: 0 0 30px rgba(80,140,255,0.4), 0 0 60px rgba(40,80,160,0.2);
      margin-bottom: 12px; z-index: 1;
    }
    .author {
      color: #8aa4d0; font-size: 16px; letter-spacing: 2px;
      margin-bottom: 40px; z-index: 1;
    }
    .chart-wrap {
      position: relative; width: 360px; height: 360px;
      margin-bottom: 30px; z-index: 1;
    }
    #hexCanvas { display: block; }
    .score-center {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      text-align: center; pointer-events: none;
    }
    .score-center .label {
      color: #4fc3f7; font-size: 14px; letter-spacing: 2px; margin-bottom: 4px;
    }
    .score-center .grade {
      color: #fff; font-size: 42px; font-weight: 900;
      text-shadow: 0 0 20px rgba(79,195,247,0.6);
    }
    .stats-grid {
      display: grid; grid-template-columns: repeat(3, 1fr);
      gap: 12px 24px; margin-bottom: 40px; z-index: 1;
      max-width: 400px; width: 100%;
    }
    .stat-item { text-align: center; }
    .stat-item .val { color: #4fc3f7; font-size: 20px; font-weight: 700; }
    .stat-item .name { color: #6a8ab8; font-size: 12px; margin-top: 2px; }
    #readBtn {
      z-index: 1;
      background: linear-gradient(135deg, #1a3a6c, #0d1f3d);
      color: #c8ddff; border: 1px solid #2a5a9e;
      padding: 14px 48px; font-size: 18px; letter-spacing: 4px;
      border-radius: 8px; cursor: pointer;
      box-shadow: 0 0 20px rgba(42,90,158,0.3);
      transition: all 0.3s; position: relative; overflow: hidden;
    }
    #readBtn:hover {
      box-shadow: 0 0 30px rgba(42,90,158,0.6);
      transform: translateY(-2px);
    }
    @media (max-width: 480px) {
      h1 { font-size: 32px; letter-spacing: 4px; }
      .chart-wrap { width: 300px; height: 300px; }
      #hexCanvas { width: 300px; height: 300px; }
      .tag-bar { top: 12px; left: 12px; gap: 6px; }
      .tag-bar span { font-size: 11px; padding: 4px 10px; }
    }
  </style>
</head>
<body>
  <div class="bg-glow-1"></div>
  <div class="bg-glow-2"></div>

  <div class="tag-bar">
    <span>法线视觉光影</span>
    <span>视觉超美学</span>
  </div>

  <h1>Web GL流体模拟</h1>
  <p class="author">作者：HXM535</p>

  <div class="chart-wrap">
    <canvas id="hexCanvas" width="360" height="360"></canvas>
    <div class="score-center">
      <div class="label">综合评分</div>
      <div class="grade">S-</div>
    </div>
  </div>

  <div class="stats-grid">
    <div class="stat-item"><div class="val">70</div><div class="name">创意</div></div>
    <div class="stat-item"><div class="val">90</div><div class="name">态度</div></div>
    <div class="stat-item"><div class="val">96</div><div class="name">开发技术</div></div>
    <div class="stat-item"><div class="val">100</div><div class="name">视觉</div></div>
    <div class="stat-item"><div class="val">60</div><div class="name">丰富程度</div></div>
    <div class="stat-item"><div class="val">95</div><div class="name">综合</div></div>
  </div>

  <button id="readBtn">点击阅览</button>

  <script>
    (function(){
      const canvas = document.getElementById('hexCanvas');
      const ctx = canvas.getContext('2d');
      const cx = 180, cy = 180, r = 120;
      const attrs = [
        {name:'创意',value:70},
        {name:'态度',value:90},
        {name:'开发技术',value:96},
        {name:'视觉',value:100},
        {name:'丰富程度',value:60},
        {name:'综合',value:95}
      ];
      const count = 6;

      function drawHex(){
        ctx.clearRect(0,0,360,360);
        for(let level=1;level<=5;level++){
          ctx.beginPath();
          for(let i=0;i<count;i++){
            const angle = Math.PI/2 + (Math.PI*2*i)/count;
            const lr = (r/5)*level;
            const x = cx + lr*Math.cos(angle);
            const y = cy + lr*Math.sin(angle);
            if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
          }
          ctx.closePath();
          ctx.strokeStyle = level===5 ? '#3a7bd5' : 'rgba(58,123,213,0.2)';
          ctx.lineWidth = level===5 ? 1.5 : 0.8;
          ctx.stroke();
        }
        for(let i=0;i<count;i++){
          const angle = Math.PI/2 + (Math.PI*2*i)/count;
          ctx.beginPath();
          ctx.moveTo(cx,cy);
          ctx.lineTo(cx+r*Math.cos(angle),cy+r*Math.sin(angle));
          ctx.strokeStyle = 'rgba(58,123,213,0.25)';
          ctx.lineWidth = 0.8;
          ctx.stroke();
        }
        ctx.beginPath();
        for(let i=0;i<count;i++){
          const angle = Math.PI/2 + (Math.PI*2*i)/count;
          const vr = (attrs[i].value/100)*r;
          const x = cx + vr*Math.cos(angle);
          const y = cy + vr*Math.sin(angle);
          if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
        }
        ctx.closePath();
        ctx.fillStyle = 'rgba(79,195,247,0.15)';
        ctx.fill();
        ctx.strokeStyle = '#4fc3f7';
        ctx.lineWidth = 2;
        ctx.stroke();
        for(let i=0;i<count;i++){
          const angle = Math.PI/2 + (Math.PI*2*i)/count;
          const vr = (attrs[i].value/100)*r;
          const x = cx + vr*Math.cos(angle);
          const y = cy + vr*Math.sin(angle);
          ctx.beginPath();
          ctx.arc(x,y,4,0,Math.PI*2);
          ctx.fillStyle = '#4fc3f7';
          ctx.fill();
          ctx.strokeStyle = '#fff';
          ctx.lineWidth = 1.5;
          ctx.stroke();
          const lx = cx + (r+22)*Math.cos(angle);
          const ly = cy + (r+22)*Math.sin(angle);
          ctx.fillStyle = '#8aa4d0';
          ctx.font = '12px sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(attrs[i].name,lx,ly);
        }
      }
      drawHex();

      document.getElementById('readBtn').addEventListener('click', function(){
        window.location.href = './Html/2.html';
      });
    })();
  </script>
</body>
</html>
