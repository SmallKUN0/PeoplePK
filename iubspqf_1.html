<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>方块世界 · 3D 沙盒</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #87ceeb; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; touch-action: none; overscroll-behavior: none; }
    #canvas-container { position: fixed; inset: 0; }
    canvas { display: block; }
    .ui { position: fixed; pointer-events: none; z-index: 10; }

    #top-bar { top: 0; left: 0; right: 0; padding: 10px 14px; padding-top: max(10px, env(safe-area-inset-top)); display: flex; justify-content: space-between; align-items: center; }
    .top-group { display: flex; align-items: center; gap: 8px; }
    #title { color: white; font-size: 13px; font-weight: 800; text-shadow: 0 2px 8px rgba(0,0,0,0.5); }
    #fps { color: white; font-size: 10px; font-weight: 700; background: rgba(0,0,0,0.4); padding: 4px 8px; border-radius: 8px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
    .top-btn { width: 34px; height: 34px; border-radius: 9px; background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.2); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); display: flex; align-items: center; justify-content: center; color: white; font-size: 14px; font-weight: 800; pointer-events: auto; cursor: pointer; transition: all 0.15s; }
    .top-btn:active { transform: scale(0.9); }
    .top-btn.active { background: rgba(124,179,66,0.6); border-color: rgba(124,179,66,0.8); }

    #crosshair { top: 50%; left: 50%; transform: translate(-50%, -50%); width: 22px; height: 22px; mix-blend-mode: difference; }
    #crosshair::before, #crosshair::after { content: ''; position: absolute; background: rgba(255,255,255,0.85); }
    #crosshair::before { top: 50%; left: 0; right: 0; height: 2px; transform: translateY(-50%); }
    #crosshair::after { left: 50%; top: 0; bottom: 0; width: 2px; transform: translateX(-50%); }

    #break-progress { position: fixed; top: 50%; left: 50%; transform: translate(-50%, 28px); width: 64px; height: 5px; background: rgba(0,0,0,0.5); border-radius: 3px; overflow: hidden; opacity: 0; transition: opacity 0.2s; z-index: 10; pointer-events: none; }
    #break-progress.show { opacity: 1; }
    #break-fill { width: 0%; height: 100%; background: linear-gradient(90deg, #ff5722, #ffc107, #fff176); transition: width 0.08s; }

    #hotbar { bottom: max(16px, env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); display: flex; gap: 5px; padding: 7px; background: rgba(0,0,0,0.4); border-radius: 12px; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); pointer-events: auto; box-shadow: 0 4px 20px rgba(0,0,0,0.3); }
    .slot { width: 40px; height: 40px; border-radius: 8px; background: rgba(255,255,255,0.08); border: 2px solid transparent; display: flex; align-items: center; justify-content: center; transition: all 0.18s; }
    .slot.active { border-color: #fff; transform: translateY(-4px) scale(1.08); background: rgba(255,255,255,0.18); box-shadow: 0 6px 16px rgba(0,0,0,0.4); }
    .slot-icon { width: 26px; height: 26px; border-radius: 4px; box-shadow: inset 0 -5px 0 rgba(0,0,0,0.25), inset 0 2px 0 rgba(255,255,255,0.2); }

    #joystick { bottom: max(24px, env(safe-area-inset-bottom)); left: max(20px, env(safe-area-inset-left)); width: 120px; height: 120px; pointer-events: auto; }
    .joy-base { width: 100%; height: 100%; border-radius: 50%; background: rgba(255,255,255,0.08); border: 2px solid rgba(255,255,255,0.25); position: relative; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); box-shadow: inset 0 0 20px rgba(0,0,0,0.2); }
    .joy-stick { width: 52px; height: 52px; border-radius: 50%; background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.5), rgba(255,255,255,0.25)); border: 2px solid rgba(255,255,255,0.7); position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); box-shadow: 0 4px 14px rgba(0,0,0,0.4); transition: transform 0.04s; }

    #actions { bottom: max(24px, env(safe-area-inset-bottom)); right: max(20px, env(safe-area-inset-right)); display: flex; flex-direction: column; gap: 10px; align-items: center; pointer-events: auto; }
    .row { display: flex; gap: 10px; }
    .btn { width: 56px; height: 56px; border-radius: 50%; background: rgba(255,255,255,0.15); border: 2px solid rgba(255,255,255,0.35); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); display: flex; align-items: center; justify-content: center; color: white; font-weight: 800; font-size: 10px; letter-spacing: 1px; transition: all 0.1s; box-shadow: 0 4px 14px rgba(0,0,0,0.25); }
    .btn:active, .btn.active { transform: scale(0.9); background: rgba(255,255,255,0.35); }
    .btn-jump { width: 68px; height: 68px; background: rgba(124,179,66,0.35); border-color: rgba(124,179,66,0.6); font-size: 11px; }
    .btn-break { background: rgba(244,67,54,0.3); border-color: rgba(244,67,54,0.55); }
    .btn-place { background: rgba(33,150,243,0.3); border-color: rgba(33,150,243,0.55); }
    .btn-down { background: rgba(156,39,176,0.3); border-color: rgba(156,39,176,0.55); display: none; }
    .btn-down.show { display: flex; }

    #hint { top: 56px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.55); color: white; padding: 8px 14px; border-radius: 16px; font-size: 11px; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); opacity: 0; transition: opacity 0.4s; pointer-events: none; white-space: nowrap; box-shadow: 0 4px 16px rgba(0,0,0,0.3); }
    #hint.show { opacity: 1; }

    #start-menu { position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; background: linear-gradient(180deg, #4a90c4 0%, #6ab0d8 40%, #8fcdee 70%, #b8e0f5 100%); overflow: hidden; }
    #start-menu::before { content: ''; position: absolute; inset: 0; background: radial-gradient(ellipse at 20% 80%, rgba(124,179,66,0.3) 0%, transparent 50%), radial-gradient(ellipse at 80% 70%, rgba(86,139,47,0.25) 0%, transparent 50%); }
    .menu-clouds { position: absolute; inset: 0; overflow: hidden; }
    .menu-cloud { position: absolute; background: rgba(255,255,255,0.7); border-radius: 50%; filter: blur(2px); animation: drift linear infinite; }
    @keyframes drift { from { transform: translateX(-120%); } to { transform: translateX(120vw); } }
    .menu-content { position: relative; z-index: 2; display: flex; flex-direction: column; align-items: center; width: 90%; max-width: 360px; }
    .menu-logo { font-size: 42px; font-weight: 900; color: white; text-shadow: 0 4px 0 rgba(0,0,0,0.2), 0 8px 24px rgba(0,0,0,0.3); letter-spacing: 4px; margin-bottom: 4px; animation: logoFloat 3s ease-in-out infinite; }
    @keyframes logoFloat { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
    .menu-sub { font-size: 12px; color: rgba(255,255,255,0.85); letter-spacing: 6px; margin-bottom: 28px; font-weight: 600; }
    .menu-cube { width: 50px; height: 50px; margin-bottom: 24px; animation: cubeSpin 4s linear infinite; transform-style: preserve-3d; }
    @keyframes cubeSpin { 0% { transform: rotateX(0) rotateY(0); } 100% { transform: rotateX(360deg) rotateY(360deg); } }
    .menu-cube div { position: absolute; width: 50px; height: 50px; border: 2px solid rgba(255,255,255,0.3); }
    .menu-cube .f1 { background: linear-gradient(135deg, #7cb342, #558b2f); transform: translateZ(25px); }
    .menu-cube .f2 { background: linear-gradient(135deg, #9d7e5f, #6d4c41); transform: rotateY(180deg) translateZ(25px); }
    .menu-cube .f3 { background: linear-gradient(135deg, #9e9e9e, #757575); transform: rotateY(90deg) translateZ(25px); }
    .menu-cube .f4 { background: linear-gradient(135deg, #8d6e63, #5d4037); transform: rotateY(-90deg) translateZ(25px); }
    .menu-cube .f5 { background: linear-gradient(135deg, #c8a679, #a1887f); transform: rotateX(90deg) translateZ(25px); }
    .menu-cube .f6 { background: linear-gradient(135deg, #e8d5a3, #d4c08a); transform: rotateX(-90deg) translateZ(25px); }
    .menu-btn { width: 100%; padding: 14px; border: none; border-radius: 12px; font-size: 14px; font-weight: 800; letter-spacing: 2px; cursor: pointer; transition: all 0.2s; margin-bottom: 10px; color: white; }
    .menu-btn:active { transform: scale(0.97); }
    .menu-btn-infinite { background: linear-gradient(135deg, #43a047, #2e7d32); box-shadow: 0 6px 20px rgba(46,125,50,0.4); }
    .menu-btn-finite { background: linear-gradient(135deg, #fb8c00, #e65100); box-shadow: 0 6px 20px rgba(230,81,0,0.4); }
    .menu-btn-desc { display: block; font-size: 9px; font-weight: 500; letter-spacing: 1px; opacity: 0.8; margin-top: 3px; }
    .menu-settings { width: 100%; margin-top: 4px; padding: 12px; background: rgba(0,0,0,0.2); border-radius: 10px; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
    .setting-row { display: flex; align-items: center; justify-content: space-between; color: white; font-size: 11px; font-weight: 600; margin-bottom: 8px; }
    .setting-row:last-child { margin-bottom: 0; }
    .setting-row label { letter-spacing: 1px; }
    .toggle-group { display: flex; gap: 4px; }
    .toggle-btn { padding: 5px 12px; border-radius: 6px; background: rgba(255,255,255,0.1); color: rgba(255,255,255,0.6); font-size: 10px; font-weight: 700; cursor: pointer; transition: all 0.15s; border: 1px solid rgba(255,255,255,0.15); }
    .toggle-btn.active { background: rgba(255,255,255,0.3); color: white; border-color: rgba(255,255,255,0.5); }
    .fov-slider { width: 100px; height: 4px; -webkit-appearance: none; appearance: none; background: rgba(255,255,255,0.25); border-radius: 2px; outline: none; }
    .fov-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; background: white; border-radius: 50%; cursor: pointer; box-shadow: 0 2px 6px rgba(0,0,0,0.3); }
    .fov-slider::-moz-range-thumb { width: 16px; height: 16px; background: white; border-radius: 50%; cursor: pointer; border: none; }
    .fov-value { font-weight: 800; min-width: 28px; text-align: right; }
    .menu-help { margin-top: 14px; color: rgba(255,255,255,0.7); font-size: 10px; text-align: center; line-height: 1.6; letter-spacing: 1px; }

    #settings-panel { position: fixed; inset: 0; z-index: 80; display: none; flex-direction: column; align-items: center; justify-content: center; background: rgba(0,0,0,0.5); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
    #settings-panel.show { display: flex; }
    .panel-card { width: 88%; max-width: 340px; background: rgba(30,35,40,0.95); border-radius: 16px; padding: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.5); }
    .panel-title { color: white; font-size: 18px; font-weight: 800; letter-spacing: 2px; text-align: center; margin-bottom: 16px; }
    .panel-setting { margin-bottom: 14px; }
    .panel-setting:last-child { margin-bottom: 0; }
    .panel-label { color: rgba(255,255,255,0.8); font-size: 11px; font-weight: 600; letter-spacing: 1px; margin-bottom: 6px; }
    .panel-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .panel-btn { padding: 10px; border: none; border-radius: 8px; font-size: 12px; font-weight: 700; cursor: pointer; transition: all 0.15s; flex: 1; }
    .panel-btn-primary { background: linear-gradient(135deg, #43a047, #2e7d32); color: white; }
    .panel-btn-secondary { background: rgba(255,255,255,0.1); color: white; border: 1px solid rgba(255,255,255,0.2); }
    .panel-btn-danger { background: linear-gradient(135deg, #f44336, #c62828); color: white; }
    .panel-btn:active { transform: scale(0.96); }

    #loading { position: fixed; inset: 0; background: linear-gradient(180deg, #6fb7e8 0%, #b8e0f5 100%); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 90; transition: opacity 0.6s; }
    #loading.hide { opacity: 0; pointer-events: none; }
    .load-title { font-size: 28px; font-weight: 900; color: white; text-shadow: 0 4px 16px rgba(0,0,0,0.3); letter-spacing: 4px; }
    .load-bar { width: 160px; height: 4px; background: rgba(255,255,255,0.3); border-radius: 2px; margin-top: 20px; overflow: hidden; }
    .load-fill { width: 0%; height: 100%; background: white; border-radius: 2px; transition: width 0.3s; }
    .load-sub { font-size: 11px; color: rgba(255,255,255,0.85); margin-top: 14px; letter-spacing: 2px; }

    @media (orientation: portrait) {
        #joystick { width: 120px; height: 120px; left: max(15px, env(safe-area-inset-left)); bottom: max(20px, env(safe-area-inset-bottom)); }
        .joy-stick { width: 50px; height: 50px; }
        .btn { width: 54px; height: 54px; font-size: 9px; }
        .btn-jump { width: 64px; height: 64px; font-size: 10px; }
        #actions { right: max(15px, env(safe-area-inset-right)); bottom: max(20px, env(safe-area-inset-bottom)); gap: 12px; }
        .row { gap: 12px; }
        .slot { width: 38px; height: 38px; }
        .slot-icon { width: 25px; height: 25px; }
        .menu-logo { font-size: 36px; }
    }
    @media (max-height: 500px) and (orientation: landscape) {
        #joystick { width: 100px; height: 100px; bottom: 12px; left: 12px; }
        .joy-stick { width: 44px; height: 44px; }
        #actions { bottom: 12px; right: 12px; }
        .btn { width: 48px; height: 48px; }
        .btn-jump { width: 58px; height: 58px; }
        #hotbar { bottom: 8px; }
        .slot { width: 34px; height: 34px; }
        .slot-icon { width: 22px; height: 22px; }
    }
</style>
</head>
<body>
    <div id="canvas-container"></div>

    <div id="start-menu">
        <div class="menu-clouds" id="menu-clouds"></div>
        <div class="menu-content">
            <div class="menu-logo">方块世界</div>

                <div class="f1"></div><div class="f2"></div><div class="f3"></div>

                无限世界<span class="menu-btn-desc">区块无限生成 · 探索不停</span>

    <div id="settings-panel">
        <div class="panel-card">
            <div class="panel-title">设置</div>
            <div class="panel-setting">
                <div class="panel-label">光影质量</div>
                <div class="panel-row">
                    <button class="panel-btn panel-btn-secondary" id="q-default">默认</button>

                </div>
            </div>
            <div class="panel-setting">
                <div class="panel-label">视野 FOV</div>
                <div class="panel-row">
                    <input type="range" min="55" max="105" value="78" class="fov-slider" id="fov-slider-2" style="flex:1">

                <button class="panel-btn panel-btn-danger" id="quit-btn">返回主菜单</button>

    <div class="ui" id="top-bar">
        <div class="top-group">
            <div class="top-btn" id="btn-menu">≡</div>

        </div>

            <div class="top-btn" id="btn-fly">飞</div>

        </div>

    <div class="ui" id="crosshair"></div>
    <div id="break-progress"><div id="break-fill"></div></div>

        <div class="row"><div class="btn btn-place" id="btn-place">放置</div><div class="btn btn-break" id="btn-break">破坏</div></div>
        <div class="row"><div class="btn btn-down" id="btn-down">下降</div><div class="btn btn-jump" id="btn-jump">跳跃</div></div>

    <script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
    </script>
    <script type="module">
    import * as THREE from 'three';

    const CFG = {
        CHUNK_SIZE: 16, WORLD_HEIGHT: 48, GRAVITY: 26, JUMP: 8.6,
        SPEED: 4.8, FLY_SPEED: 9.5, P_H: 1.8, P_EYE: 1.62, P_W: 0.6,
        REACH: 5.5, RENDER_DIST: 3, FINITE_RADIUS: 1,
    };

    const BLOCKS = {
        grass:       { c: { top: 0x7cb342, side: 0x9d7e5f, bottom: 0x6d4c41 }, icon: '#7cb342' },
        dirt:        { c: { all: 0x9d7e5f }, icon: '#9d7e5f' },
        stone:       { c: { all: 0x9e9e9e }, icon: '#9e9e9e' },
        cobblestone: { c: { all: 0x7d7d7d }, icon: '#7d7d7d' },
        wood:        { c: { top: 0xa1887f, side: 0x5d4037, bottom: 0xa1887f }, icon: '#5d4037' },
        planks:      { c: { all: 0xc8a679 }, icon: '#c8a679' },
        leaves:      { c: { all: 0x558b2f }, icon: '#558b2f' },
        sand:        { c: { all: 0xe8d5a3 }, icon: '#e8d5a3' },
    };
    const TYPES = Object.keys(BLOCKS);

    function hash3(x, y, z, f) {
        let h = (x * 374761393 + y * 668265263 + z * 1274126177 + f * 7919) | 0;
        h = ((h ^ (h >>> 13)) * 1274126177) | 0;
        h = (h ^ (h >>> 16)) >>> 0;
        return h / 0xFFFFFFFF;
    }
    function noise(x, z) {
        return Math.sin(x*0.15)*Math.cos(z*0.13)*2.5
             + Math.sin(x*0.07+z*0.09)*3.5
             + Math.cos(x*0.04-z*0.06)*2
             + Math.sin((x+z)*0.21)*0.6;
    }
    const getHeight = (x, z) => Math.floor(8 + noise(x, z));

    const chunks = new Map();
    const ck = (cx, cz) => cx + ',' + cz;
    function getChunk(cx, cz) {
        const key = ck(cx, cz);
        if (!chunks.has(key)) chunks.set(key, { cx, cz, generated: false, blocks: new Map(), meshes: {}, dirty: true });
        return chunks.get(key);
    }
    function getBlock(wx, wy, wz) {
        if (wy < 0 || wy >= CFG.WORLD_HEIGHT) return null;
        const cx = Math.floor(wx / CFG.CHUNK_SIZE), cz = Math.floor(wz / CFG.CHUNK_SIZE);
        const chunk = chunks.get(ck(cx, cz));
        if (!chunk || !chunk.generated) return null;
        return chunk.blocks.get(wx + ',' + wy + ',' + wz);
    }
    function setBlock(wx, wy, wz, type) {
        if (wy < 0 || wy >= CFG.WORLD_HEIGHT) return;
        const cx = Math.floor(wx / CFG.CHUNK_SIZE), cz = Math.floor(wz / CFG.CHUNK_SIZE);
        const chunk = getChunk(cx, cz);
        const key = wx + ',' + wy + ',' + wz;
        if (type) chunk.blocks.set(key, type); else chunk.blocks.delete(key);
        chunk.dirty = true;
        const lx = wx - cx * CFG.CHUNK_SIZE, lz = wz - cz * CFG.CHUNK_SIZE;
        if (lx === 0) markDirty(cx - 1, cz);
        if (lx === CFG.CHUNK_SIZE - 1) markDirty(cx + 1, cz);
        if (lz === 0) markDirty(cx, cz - 1);
        if (lz === CFG.CHUNK_SIZE - 1) markDirty(cx, cz + 1);
    }
    function markDirty(cx, cz) { const c = chunks.get(ck(cx, cz)); if (c) c.dirty = true; }
    function isSolid(wx, wy, wz) { return getBlock(wx, wy, wz) != null; }

    function generateChunk(cx, cz) {
        const chunk = getChunk(cx, cz);
        if (chunk.generated) return;
        const baseX = cx * CFG.CHUNK_SIZE, baseZ = cz * CFG.CHUNK_SIZE;
        for (let x = 0; x < CFG.CHUNK_SIZE; x++) {
            for (let z = 0; z < CFG.CHUNK_SIZE; z++) {
                const wx = baseX + x, wz = baseZ + z;
                const h = getHeight(wx, wz);
                const beach = h <= 6;
                setBlockRaw(wx, h, wz, beach ? 'sand' : 'grass');
                for (let y = h-1; y > h-3; y--) if (y >= 0) setBlockRaw(wx, y, wz, beach ? 'sand' : 'dirt');
                for (let y = h-3; y >= 0; y--) setBlockRaw(wx, y, wz, 'stone');

    function addFace(d, lx, wy, lz, fi, type, wx, wy_w, wz_w) {
        const f = FACES[fi];
        const baseCol = new THREE.Color(faceColor(type, f.type));
        const aoDirs = AO_DIRS[fi];
        for (let vi = 0; vi < 4; vi++) {
            const v = f.verts[vi];
            let lightFactor = f.light;
            if (enableAO) {
                const o = aoDirs[vi];
                const s1 = isSolid(wx + o[0][0], wy_w + o[0][1], wz_w + o[0][2]);
                const s2 = isSolid(wx + o[1][0], wy_w + o[1][1], wz_w + o[1][2]);
                const c = isSolid(wx + o[2][0], wy_w + o[2][1], wz_w + o[2][2]);

    function buildChunkMesh(cx, cz, isInitial = false) {

        const geomData = {};
        for (const t of TYPES) geomData[t] = { pos: [], nor: [], col: [], idx: [] };
        for (const [key, type] of chunk.blocks) {
            const parts = key.split(',');
            const wx = parseInt(parts[0]), wy = parseInt(parts[1]), wz = parseInt(parts[2]);
            if (Math.floor(wx / CFG.CHUNK_SIZE) !== cx || Math.floor(wz / CFG.CHUNK_SIZE) !== cz) continue;
            const lx = wx - baseX, lz = wz - baseZ;
            for (let i = 0; i < 6; i++) {
                const f = FACES[i];
                if (!isSolid(wx + f.dir[0], wy + f.dir[1], wz + f.dir[2]))
                    addFace(geomData[type], lx, wy, lz, i, type, wx, wy, wz);

        for (const t of TYPES) {
            const d = geomData[t];

            g.setAttribute('color', new THREE.Float32BufferAttribute(d.col, 3));

            if (keys['d']||keys['arrowright']) kmr+=1; if (keys['a']||keys['arrowleft']) kmr-=1;
            move.add(fwd.clone().multiplyScalar(kmf)); move.add(rgt.clone().multiplyScalar(kmr));
            if (move.lengthSq() > 1) move.normalize();

        if (!game.started) return;

        if (game.mode === 'infinite') {

                for (let dx = -CFG.RENDER_DIST; dx <= CFG.RENDER_DIST; dx++)

            for (const [key, chunk] of chunks) {

        }
        dirty.sort((a,b) => a.d - b.d);

            const chunk = chunks.get(ck(d.cx, d.cz));

            buildChunkMesh(d.cx, d.cz, wasEmpty);
            chunk.dirty = false;
            built++;

    function raycastBlock() {
        const origin = new THREE.Vector3(player.pos.x, player.pos.y + CFG.P_EYE, player.pos.z);
        const dir = new THREE.Vector3(); camera.getWorldDirection(dir);
        let x = Math.floor(origin.x), y = Math.floor(origin.y), z = Math.floor(origin.z);
        const sx = Math.sign(dir.x), sy = Math.sign(dir.y), sz = Math.sign(dir.z);
        const tdx = dir.x !== 0 ? Math.abs(1/dir.x) : Infinity;
        const tdy = dir.y !== 0 ? Math.abs(1/dir.y) : Infinity;
        const tdz = dir.z !== 0 ? Math.abs(1/dir.z) : Infinity;
        let tmx = dir.x !== 0 ? (sx > 0 ? (x+1-origin.x)/dir.x : (origin.x-x)/-dir.x) : Infinity;
        let tmy = dir.y !== 0 ? (sy > 0 ? (y+1-origin.y)/dir.y : (origin.y-y)/-dir.y) : Infinity;
        let tmz = dir.z !== 0 ? (sz > 0 ? (z+1-origin.z)/dir.z : (origin.z-z)/-dir.z) : Infinity;
        let face = null, dist = 0;
        while (dist < CFG.REACH) {
            if (isSolid(x, y, z)) return { x, y, z, face };
            if (tmx < tmy && tmx < tmz) { x += sx; dist = tmx; tmx += tdx; face = [-sx,0,0]; }
            else if (tmy < tmz) { y += sy; dist = tmy; tmy += tdy; face = [0,-sy,0]; }
            else { z += sz; dist = tmz; tmz += tdz; face = [0,0,-sz]; }
        }
        return null;
    }

    let selectedBlock = 'grass';
    function placeBlock() {
        const t = raycastBlock();
        if (!t || !t.face) return;
        const nx = t.x+t.face[0], ny = t.y+t.face[1], nz = t.z+t.face[2];
        if (ny < 0 || ny >= CFG.WORLD_HEIGHT) return;
        const a = getAABB(player.pos);
        if (a.max[0] > nx && a.min[0] < nx+1 && a.max[1] > ny && a.min[1] < ny+1 && a.max[2] > nz && a.min[2] < nz+1) return;
        setBlock(nx, ny, nz, selectedBlock);
        spawnAnim(nx, ny, nz, selectedBlock, 0, 1, 0.22);
    }

    const hlLine = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(1.005,1.005,1.005)), new THREE.LineBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.5 }));
    hlLine.visible = false; scene.add(hlLine);

    const animBlocks = [];
    function spawnAnim(x, y, z, type, fromS, toS, dur) {
        const c = BLOCKS[type].c.top || BLOCKS[type].c.all;
        const mesh = new THREE.Mesh(new THREE.BoxGeometry(1,1,1), new THREE.MeshLambertMaterial({ color: c }));
        mesh.position.set(x+0.5, y+0.5, z+0.5); mesh.scale.setScalar(fromS); mesh.castShadow = true;
        scene.add(mesh);
        animBlocks.push({ mesh, time: 0, dur, fromS, toS });
    }
    function updateAnim(dt) {
        for (let i = animBlocks.length-1; i >= 0; i--) {
            const a = animBlocks[i]; a.time += dt;
            const t = a.time / a.dur;
            if (t >= 1) { scene.remove(a.mesh); a.mesh.geometry.dispose(); a.mesh.material.dispose(); animBlocks.splice(i,1); }
            else { const e = t < 0.5 ? 2*t*t : 1 - Math.pow(-2*t+2,2)/2; a.mesh.scale.setScalar(a.fromS + (a.toS-a.fromS)*e); a.mesh.rotation.y = (1-e)*0.3; }
        }
    }

    const armGroup = new THREE.Group();
    const armMat = new THREE.MeshLambertMaterial({ color: 0xf0c8a0 });
    const arm = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.2, 0.55), armMat);
    arm.position.set(0, -0.08, -0.3);
    armGroup.add(arm);
    const heldBlock = new THREE.Mesh(new THREE.BoxGeometry(0.34, 0.34, 0.34), new THREE.MeshLambertMaterial({ color: 0xffffff }));
    heldBlock.position.set(0, -0.05, -0.45);
    armGroup.add(heldBlock);
    armGroup.traverse(c => { if (c.isMesh) { c.renderOrder = 999; c.material.depthTest = false; } });
    armGroup.position.set(0.38, -0.38, -0.55);
    armGroup.rotation.x = -0.4;
    camera.add(armGroup);
    const armLight = new THREE.PointLight(0xffffff, 0.6, 3);
    armLight.position.set(0, 0, 0);
    camera.add(armLight);

    const hotbar = document.getElementById('hotbar');
    const updateHeldBlock = () => { heldBlock.material.color.setHex(BLOCKS[selectedBlock].c.all || BLOCKS[selectedBlock].c.top || 0xffffff); };
    TYPES.forEach(type => {
        const slot = document.createElement('div');
        slot.className = 'slot' + (type === selectedBlock ? ' active' : '');
        slot.innerHTML = `<div class="slot-icon" style="background:${BLOCKS[type].icon}"></div>`;
        const sel = e => { e.preventDefault(); selectedBlock = type; document.querySelectorAll('.slot').forEach(s => s.classList.remove('active')); slot.classList.add('active'); updateHeldBlock(); };
        slot.addEventListener('touchstart', sel, { passive: false });
        slot.addEventListener('click', sel);
        hotbar.appendChild(slot);
    });
    updateHeldBlock();

    function setFOV(v) { game.fov = v; camera.fov = v; camera.updateProjectionMatrix(); document.getElementById('fov-value').textContent = v; document.getElementById('fov-value-2').textContent = v; document.getElementById('fov-slider').value = v; document.getElementById('fov-slider-2').value = v; }
    document.getElementById('fov-slider').addEventListener('input', e => setFOV(parseInt(e.target.value)));
    document.getElementById('fov-slider-2').addEventListener('input', e => setFOV(parseInt(e.target.value)));

    // ===== 修复光影切换 Bug =====
    function setQuality(q) {
        graphicsQuality = q;
        enableAO = (q === 'high');
        document.querySelectorAll('.toggle-btn').forEach(b => b.classList.toggle('active', b.dataset.q === q));
        document.getElementById('q-default').classList.remove('panel-btn-primary');
        document.getElementById('q-high').classList.remove('panel-btn-primary');
        if (q === 'default') document.getElementById('q-default').classList.add('panel-btn-primary');
        else document.getElementById('q-high').classList.add('panel-btn-primary');
        
        // 阴影相机范围自适应渲染距离，防止阴影被截断
        const sd = CFG.RENDER_DIST * CFG.CHUNK_SIZE * 0.9;
        sun.shadow.camera.left = -sd;
        sun.shadow.camera.right = sd;
        sun.shadow.camera.top = sd;
        sun.shadow.camera.bottom = -sd;
        
        if (q === 'high') {
            // 检查设备是否支持 4096 纹理
            const maxSize = renderer.capabilities.maxTextureSize;
            const size = maxSize >= 4096 ? 4096 : 2048;
            sun.shadow.mapSize.set(size, size);
            sun.shadow.bias = -0.0005;
            sun.shadow.normalBias = 0.03;
            ambient.intensity = 0.34; // 略微降低，让 AO 更明显
            hemi.intensity = 0.28;
            scene.fog.near = 34; scene.fog.far = 76;
        } else {
            sun.shadow.mapSize.set(2048, 2048);
            sun.shadow.bias = -0.0008;
            sun.shadow.normalBias = 0.04;
            ambient.intensity = 0.42;
            hemi.intensity = 0.32;
            scene.fog.near = 30; scene.fog.far = 68;
        }
        
        // 关键修复：强制释放旧的阴影贴图，使其按新尺寸重建
        if (sun.shadow.map) {
            sun.shadow.map.dispose();
            sun.shadow.map = null;
        }
        // 更新阴影相机投影矩阵
        sun.shadow.camera.updateProjectionMatrix();
        
        // 重建所有网格以应用或移除 AO
        for (const [key, chunk] of chunks) if (chunk.generated) { chunk.dirty = true; }
    }
    document.querySelectorAll('.toggle-btn').forEach(b => b.addEventListener('click', () => setQuality(b.dataset.q)));
    document.getElementById('q-default').addEventListener('click', () => setQuality('default'));
    document.getElementById('q-high').addEventListener('click', () => setQuality('high'));

    const menuClouds = document.getElementById('menu-clouds');
    for (let i = 0; i < 8; i++) {
        const c = document.createElement('div'); c.className = 'menu-cloud';
        const s = 40 + Math.random()*80;
        c.style.width = s+'px'; c.style.height = (s*0.4)+'px'; c.style.top = (10+Math.random()*70)+'%';
        c.style.animationDuration = (15+Math.random()*20)+'s'; c.style.animationDelay = (-Math.random()*20)+'s';
        menuClouds.appendChild(c);
    }

    function startGame(mode) {
        game.mode = mode; game.started = true;
        document.getElementById('start-menu').style.display = 'none';
        document.getElementById('load-fill').style.width = '0%';
        document.getElementById('loading').classList.remove('hide');
        document.getElementById('load-sub').textContent = '正在生成世界...';
        for (const [key, chunk] of chunks) for (const t in chunk.meshes) { scene.remove(chunk.meshes[t]); chunk.meshes[t].geometry.dispose(); chunk.meshes[t].material.dispose(); }
        chunks.clear(); lastChunkX = Infinity;
        setTimeout(() => {
            if (mode === 'finite') {
                for (let cx = -CFG.FINITE_RADIUS; cx <= CFG.FINITE_RADIUS; cx++)
                    for (let cz = -CFG.FINITE_RADIUS; cz <= CFG.FINITE_RADIUS; cz++) generateChunk(cx, cz);
                document.getElementById('load-fill').style.width = '60%';
                setTimeout(() => {
                    for (const [key, chunk] of chunks) if (chunk.dirty) { buildChunkMesh(chunk.cx, chunk.cz, true); chunk.dirty = false; }
                    finishStart();
                }, 50);
            } else {
                for (let dx = -1; dx <= 1; dx++) for (let dz = -1; dz <= 1; dz++) generateChunk(dx, dz);
                document.getElementById('load-fill').style.width = '50%';
                setTimeout(() => {
                    for (let dx = -1; dx <= 1; dx++) for (let dz = -1; dz <= 1; dz++) { buildChunkMesh(dx, dz, true); chunks.get(ck(dx,dz)).dirty = false; }
                    finishStart();
                }, 50);
            }
        }, 100);
    }
    function finishStart() {
        document.getElementById('load-fill').style.width = '100%';
        document.getElementById('load-sub').textContent = '准备就绪!';
        findSpawn();
        setTimeout(() => {
            document.getElementById('loading').classList.add('hide');
            showHint(game.mode === 'infinite' ? '无限世界 · 探索无边界' : '有限世界 · 48×48 方块');
            setTimeout(() => document.getElementById('hint').classList.remove('show'), 3500);
        }, 300);
    }
    document.getElementById('btn-infinite').addEventListener('click', () => startGame('infinite'));
    document.getElementById('btn-finite').addEventListener('click', () => startGame('finite'));

    let hintTimer = null;
    function showHint(text) { const h = document.getElementById('hint'); h.textContent = text; h.classList.add('show'); clearTimeout(hintTimer); hintTimer = setTimeout(() => h.classList.remove('show'), 2500); }

    window.addEventListener('resize', () => { camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });

    let lastT = performance.now(), frames = 0, fpsT = 0;
    const fpsEl = document.getElementById('fps'), breakFill = document.getElementById('break-fill'), breakBar = document.getElementById('break-progress');

    function tick(now) {
        requestAnimationFrame(tick);
        const dt = Math.min(0.05, (now - lastT) / 1000);
        lastT = now;
        if (game.started) {
            updatePlayer(dt);
            updateChunks();
            if (breakTarget) {
                const cur = raycastBlock();
                if (!cur || cur.x !== breakTarget.x || cur.y !== breakTarget.y || cur.z !== breakTarget.z) { breakTarget = cur; breakTime = 0; }
                if (breakTarget) {
                    breakTime += dt;
                    player.breakAnim = 1;
                    const bt = getBlock(breakTarget.x, breakTarget.y, breakTarget.z);
                    const dur = (bt === 'stone' || bt === 'cobblestone') ? 0.7 : 0.42;
                    const p = Math.min(1, breakTime / dur);
                    breakFill.style.width = (p*100)+'%'; breakBar.classList.add('show');
                    if (p >= 1) {
                        spawnAnim(breakTarget.x, breakTarget.y, breakTarget.z, bt, 1, 0, 0.28);
                        setBlock(breakTarget.x, breakTarget.y, breakTarget.z, null);
                        breakTarget = raycastBlock(); breakTime = 0;
                        if (!breakTarget) breakBar.classList.remove('show');
                    }
                } else breakBar.classList.remove('show');
            }
            const target = breakTarget || raycastBlock();
            if (target) { hlLine.position.set(target.x+0.5, target.y+0.5, target.z+0.5); hlLine.visible = true; } else hlLine.visible = false;
            updateAnim(dt);

            const bobY = game.flying ? 0 : Math.sin(player.walkPhase) * 0.06;
            const bobX = game.flying ? 0 : Math.cos(player.walkPhase * 0.5) * 0.035;
            camera.position.set(player.pos.x + bobX*0.3, player.pos.y + CFG.P_EYE + bobY, player.pos.z);
            const dir = new THREE.Vector3(-Math.sin(player.yaw)*Math.cos(player.pitch), Math.sin(player.pitch), -Math.cos(player.yaw)*Math.cos(player.pitch));
            camera.lookAt(camera.position.x+dir.x, camera.position.y+dir.y, camera.position.z+dir.z);

            const walking = player.onGround && Math.hypot(player.vel.x, player.vel.z) > 0.5;
            let armRotX = -0.4, armRotZ = 0;
            if (walking) { armRotX = -0.4 + Math.sin(player.walkPhase) * 0.18; armRotZ = Math.cos(player.walkPhase * 0.5) * 0.06; }
            if (player.breakAnim > 0) armRotX = -0.4 - player.breakAnim * 1.2;
            if (player.placeAnim > 0) armRotX = -0.4 + player.placeAnim * 0.6;
            armGroup.rotation.x += (armRotX - armGroup.rotation.x) * 0.3;
            armGroup.rotation.z += (armRotZ - armGroup.rotation.z) * 0.3;

            sun.position.set(player.pos.x + 30, player.pos.y + 55, player.pos.z + 20);
            sun.target.position.set(player.pos.x, player.pos.y, player.pos.z);
            sun.target.updateMatrixWorld();
        }
        const time = now * 0.001;
        cloudGroup.children.forEach(c => { c.position.x = c.userData.baseX + time * 0.6; if (c.position.x > 55) c.position.x -= 110; });
        frames++; fpsT += dt;
        if (fpsT >= 0.5) { fpsEl.textContent = Math.round(frames/fpsT) + ' FPS'; frames = 0; fpsT = 0; }
        renderer.render(scene, camera);
    }
    requestAnimationFrame(tick);
    </script>
</body>
</html>
